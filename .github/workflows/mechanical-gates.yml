name: Mechanical gates

# 本仓的机械门在 setup.sh 里是 warn-only（不中断安装，沿 sync_principles 既有 idiom），
# 唯一硬拦是 pytest —— 而 pytest 是否被跑取决于开发者本地是否装了它、用哪个 python3。
# ∴ 目标态下必须有一条 CI 泳道把这些门真正跑起来，否则「机械等值门一次封死漂移面」
# 这个承诺在多数路径上不成立（冷代码审 E3 实证：CI 此前只跑一个 Windows smoke 文件）。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    # 🔴 两条泳道，**bash 版本是分泳道的理由**〔code-review 对抗镜 C〕：
    # macOS runner 自带 bash **3.2**（GPLv2 末版），ubuntu 是 bash 5.x。本仓有一类缺陷
    # 【只在 3.2 上罢工】——3.2 扫变量名不是 multibyte-aware，`"$var，"` 会把全角标点首字节
    # 吞进标识符，`set -u` 下当场 unbound variable（实测撞过：罢工点在 kill 之前 ⇒ 整个清理
    # 逻辑一次都不执行、孤儿照跑）。`test_hack_shell_multibyte_guard.py` 是**静态正则代理**，
    # 对【已知形态】无假阴性，但挡不住一种不匹配该正则的新罢工形态 ⇒ 只有 ubuntu 泳道时，
    # 真实 3.2 运行时行为从未被跑过，而静态门的存在会制造「已机械覆盖」的错觉。
    # 同理：`timeout`/`gtimeout` 缺失分支在 ubuntu 上恒 skip（自带 coreutils），只有 macOS 跑得到。
    #
    # 🔴 **os × python 刻意不做笛卡尔积**——两条轴各自的理由互不相干，交叉只是重复验证：
    #   os 轴的理由 = bash 3.2 vs 5.x（上面那段），**与 python 版本无关**；
    #   python 轴的理由 = 脚本被 symlink 进【消费仓】，要在别人机器的任意 python3 上跑
    #     （零依赖不变量 `MUST NOT import yaml` 正是为此存在），**与 os 无关**。
    #   且本仓是 private ⇒ macOS runner 按 **10 倍**计费。全交叉 = 6 job（3 个 macOS），
    #   而多出的 2 个 macOS job 一条新信息都不产生。∴ python 轴只铺在最廉价的 ubuntu 上。
    #
    # python 三档的选取（**固定版本，MUST NOT 用浮动的 `3.x`**——同第 34 行「别让 CI 的绿
    # 依赖于时点」：浮动会在新版发布当天无预警变红，且历史 job 不可复现）：
    #   3.9  = 真实下限。macOS 自带 `/usr/bin/python3` 就是 3.9.x，消费仓在 mac 上跑
    #          skill 脚本很可能落在它上面。上游虽已 EOL，Apple 仍在系统里带着它。
    #   3.12 = 原有单档 + Ubuntu 24.04 自带，保留以不丢现有信号。
    #   3.14 = 当前上限。
    # ⚠️ 3.9 显式钉 **ubuntu-24.04**：actions/python-versions 的 3.9.25 只有 22.04/24.04
    #    构建（无 26.04），而 26.04 已进 manifest ⇒ `ubuntu-latest` 漂过去那天 3.9 会装不上。
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,  python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest,  python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # yq(mikefarah) —— 7 份 `_yq()` 消费点（shared-yaml-subset-parser）的运行依赖，
      # 全部 4 条泳道都要装（ubuntu ×3 + macOS ×1，pytest 全量都会跑到这些脚本）。
      # 🔴 **钉死版本**（同下方第「MUST NOT 用浮动版本」的既有取舍）：从 GitHub Releases
      # 直接下载对应平台/架构的二进制装进 PATH，不用 apt/brew/snap 的"最新版"——三者版本
      # 随时间漂移会让 CI 的绿依赖于时点；且 ubuntu runner 的 snapd 在 Actions 环境里不总
      # 可靠、`brew install` 拿到的是当天的最新版而非固定版本。用 `uname -m` 自适应架构而非
      # 写死 amd64——GitHub 已把 `macos-latest` 指向 Apple Silicon（arm64）runner，且该指向
      # 会随时间推移改变。版本与本仓开发环境实测通过的版本一致（v4.53.3，mikefarah/yq）。
      - name: Install yq (mikefarah/yq, pinned v4.53.3)
        run: |
          set -eu
          YQ_VERSION="v4.53.3"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"   # linux / darwin
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) YQ_ARCH="amd64" ;;
            arm64|aarch64) YQ_ARCH="arm64" ;;
            *) echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          BIN="yq_${OS}_${YQ_ARCH}"
          curl -sSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${BIN}" -o /tmp/yq
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          yq --version

      # pytest>=8 是硬下限：仓根 conftest.py 用 `@pytest.hookimpl(wrapper=True)`（8+ 才有）。
      # 裸 `pip install pytest` 今天恰好装到 8.x，但那是**当下 PyPI 的最新版碰巧满足**，
      # 不是约束——pin 住下限，别让 CI 的绿依赖于时点。与 pytest.ini 的 minversion 成对。
      # 附带收益：3.9 泳道上 pip 会自动解析到 pytest 8.x（9.x 要求更高的 python），
      # 其余泳道拿 9.x ⇒ 两个 pytest 大版本都被跑到（本地已验 8.4.2 / 9.1.1 均全绿）。
      - name: Install pytest
        run: python -m pip install "pytest>=8"

      # 🔴 macOS runner **不自带 GNU coreutils** ⇒ 无 `timeout`/`gtimeout`。
      # 没有它，`test_outside_voice_child_lifecycle.py` 的 11 条用例全部 skip
      # （skip 理由：「需要真 timeout/gtimeout——假 stub 自己也会 background，验不出进程组级联」）——
      # 而**那 11 条正是本泳道存在的理由**（在真 bash 3.2 上验进程组回收）。
      # 不装 = 泳道绿但承诺没兑现，即本仓 fix-mechanical-layer-silent-failures 所治的同形病。
      # 实证：首次加本泳道时 macos 报 1741 passed/15 skipped vs ubuntu 1749/7，差的 8 条即此。
      - name: Install coreutils (macOS only — 提供 gtimeout)
        if: runner.os == 'macOS'
        run: brew install coreutils

      # 🔴 openspec CLI 同属「装了才跑得到」的那一类（与上面 coreutils **同形**）：
      # `hack/tests/test_decision_memo_gate.py` 的门 2（「存在态 ≠ 合格态」）用
      # `pytest.mark.skipif(shutil.which("openspec") is None)` 守着 —— 不装它，
      # 门 2 的用例在**全部**泳道恒 skip（本地实测：`env PATH=/usr/bin:/bin` 跑同一文件，
      # 门 2 全数 skip），即「泳道绿但承诺没兑现」，
      # 本仓 fix-mechanical-layer-silent-failures 所治的同形病。
      #
      # **只铺一条泳道**（沿本文件「两条轴各自的理由互不相干，交叉只是重复验证」的既有取舍）：
      # openspec 是 node CLI，其行为**与 os 无关、与 python 版本无关** ⇒ 铺满 4 条只是
      # 同一信息重复 4 次，而 macOS 泳道按 10 倍计费。选最廉价的 ubuntu-latest × 3.12。
      #
      # **钉死版本**（同第 31 行「MUST NOT 用浮动版本」）：这 6 条用例断言的是
      # **CLI 1.5.0 的具体行为**（`validate --strict` 只覆盖 delta specs），
      # 浮动到新版会在发布当天无预警变红且历史 job 不可复现。本机实测基线即 1.5.0。
      # node 下限来自该包的 `engines: {node: ">=20.19.0"}`（实查 npm 全局包 package.json）。
      - name: Setup Node (openspec CLI 的运行时 — 仅这一条泳道)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install openspec CLI (让 validate 门真跑起来)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          npm install -g @fission-ai/openspec@1.5.0
          openspec --version

      # 三道门各自独立跑、各自能红——不合并成一步，否则先失败的那道会掩盖后面的。
      - name: Gate — async 调度段两处字节等值（ADR-5）
        run: python hack/check_async_branch_parity.py

      - name: Gate — 四条通则托管块与真相源一致
        run: python hack/sync_principles.py --check

      - name: Full test suite
        # `-rs` 让 skip 理由**逐条可见**：跨平台泳道上「本地 passed、CI 变 skipped」是
        # 零信号静默降级的经典形态（泳道绿，但那几条根本没跑）。不打印理由就只能靠
        # 数数猜是哪几条——本仓 fix-mechanical-layer-silent-failures 治的正是这类病。
        run: python -m pytest -q -rs -W error
