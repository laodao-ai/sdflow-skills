<!doctype html>
<!-- S32 · 机制动画 · 示意 · script 140–148「第一件事，写计划。……测试驱动开发那三步，就直接写在计划里了。」
     Superpowers 写计划：把 OpenSpec 的任务清单拆成一个个开发任务，每个任务写清改哪些文件、配哪个测试，
     再加固定五步。依据 Superpowers 6.4.2 writing-plans 的任务模版（Files / Test，然后
     write the failing test → run it, verify it fails → implement minimal code → run, verify it passes → commit）。
     - 左：OpenSpec 的 `tasks.md`（蓝）。待办只画灰条，不编具体任务。
     - 琥珀箭头进 Superpowers 区（箭头取它进入的区块色）：右边一叠开发任务卡，任务 1 展开。
     - 展开卡：「要改的文件」「配的测试」两格，下面固定五步，跟口播逐行点亮。
       没点亮 = 浅灰字、空心编号；点亮 = 墨字、琥珀编号。
     - 红 / 绿只用在两个「跑」步骤的结果灯上（测试失败 / 通过），底色从奶白渐变过去。
     - 黄框 = 当前讲到的：tasks.md → 任务 1 → 两格 → 五步逐行 → 结论贴纸。
     - 结论贴纸「TDD 三步写在计划里」：定下来的事实，轻倾斜。 -->
<html lang="zh-CN" data-frame-id="S32">
<head>
<meta charset="utf-8">
<title>S32 · 写计划</title>
<link rel="stylesheet" href="theme.css">
<style>
  .head { left: 90px; top: 62px; font-size: 58px; color: #161616; }

  /* 左：OpenSpec 的 tasks.md */
  #todo { left: 90px; top: 300px; width: 440px; height: 420px; padding: 56px 36px 30px; }
  #todo .fname { font-family: var(--mono); font-weight: 700; font-size: 38px; color: var(--blue-soft); margin-bottom: 26px; }
  .todo-row { display: flex; align-items: center; gap: 22px; height: 64px; }
  .todo-row .box { flex: none; width: 36px; height: 36px; box-sizing: border-box; border: 5px solid var(--cream); border-radius: 5px; }
  .todo-row .bar { height: 16px; border-radius: 8px; background: var(--cream-dim); }

  #arw { position: absolute; left: 540px; top: 470px; width: 140px; height: 80px; }

  /* 右：Superpowers 区。子元素坐标相对这个区。 */
  #zone { left: 690px; top: 240px; width: 1160px; height: 660px; padding: 0; }
  #zone > .tab { font-size: 48px; }
  .tcard {
    left: 36px; width: 250px; height: 100px; padding: 0; box-shadow: 7px 7px 0 var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 800; font-size: 46px;
  }
  #link { position: absolute; left: 278px; top: 111px; width: 56px; height: 18px; box-sizing: border-box;
    background: var(--amber); border: 4px solid var(--ink); border-radius: 9px; }

  /* 任务 1 展开 */
  #detail { left: 320px; top: 46px; width: 800px; height: 574px; padding: 52px 36px 24px; }
  #detail > .tab { font-size: 40px; }
  .fields { display: flex; gap: 24px; }
  .fld {
    flex: 1; display: flex; align-items: center; gap: 18px; height: 92px; box-sizing: border-box; padding: 0 22px;
    border: 4px solid var(--ink); border-radius: 8px; background: #fff;
    font-family: var(--display); font-weight: 800; font-size: 40px; white-space: nowrap;
  }
  .fld svg { width: 54px; height: 54px; flex: none; }
  .cap { margin: 22px 0 6px; font-weight: 600; font-size: 34px; color: #4a4741; }
  .step { display: flex; align-items: center; gap: 22px; height: 56px; margin-top: 10px; padding: 0 10px; border-radius: 8px;
    font-family: var(--display); font-weight: 800; font-size: 42px; white-space: nowrap; }
  .step .num { width: 50px; height: 50px; font-size: 26px; border-width: 4px; }
  .lamp { margin-left: auto; width: 170px; height: 50px; box-sizing: border-box; border-radius: 8px;
    border: 4px solid var(--ink); background: var(--cream); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 800; font-size: 30px; letter-spacing: 2px; }

  /* 结论贴纸：两行，放在任务卡下面的空处 */
  #tdd { left: 30px; top: 462px; white-space: normal; text-align: center; font-size: 40px; line-height: 1.3; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs big head" id="head">第一件事：写计划</div>
  <div class="mock">示意</div>

  <!-- 左：OpenSpec 的任务清单，列的是要做什么 -->
  <div class="card os" id="todo" data-r="-1.2" data-shadow="10">
    <div class="tab os">OpenSpec</div>
    <div class="fname">tasks.md</div>
    <div class="todo-row tr"><span class="box"></span><span class="bar" style="width:260px"></span></div>
    <div class="todo-row tr"><span class="box"></span><span class="bar" style="width:200px"></span></div>
    <div class="todo-row tr"><span class="box"></span><span class="bar" style="width:290px"></span></div>
    <div class="todo-row tr"><span class="box"></span><span class="bar" style="width:170px"></span></div>
  </div>

  <!-- 琥珀箭头：进 Superpowers 区 -->
  <svg id="arw" viewBox="0 0 140 80">
    <path d="M24 44 Q 66 26 104 38" fill="none" stroke="#161616" stroke-width="20" stroke-linecap="round"/>
    <path d="M24 44 Q 66 26 104 38" fill="none" stroke="#f29b50" stroke-width="12" stroke-linecap="round"/>
    <circle cx="18" cy="46" r="14" fill="#f29b50" stroke="#161616" stroke-width="5"/>
    <polygon points="94,14 136,42 96,68" fill="#f29b50" stroke="#161616" stroke-width="5" stroke-linejoin="round"/>
  </svg>

  <!-- 右：Superpowers 拆出的开发任务 -->
  <div class="card sp" id="zone" data-r="0.6" data-shadow="16">
    <div class="tab sp">Superpowers</div>
    <div class="card tcard" id="t1" data-r="-1.5" data-shadow="7" style="top:70px">任务 1</div>
    <div class="card tcard" id="t2" data-r="1" data-shadow="7" style="top:200px">任务 2</div>
    <div class="card tcard" id="t3" data-r="-1" data-shadow="7" style="top:330px">任务 3</div>
    <div id="link"></div>

    <div class="card" id="detail" data-r="-0.6" data-shadow="10">
      <div class="tab ink">任务 1</div>
      <div class="fields">
        <div class="fld" id="f1" data-shadow="0">
          <svg viewBox="0 0 64 64" fill="none" stroke="#161616" stroke-width="6" stroke-linejoin="round">
            <path d="M14 6 H40 L52 18 V58 H14 Z"/><path d="M40 6 V18 H52"/>
          </svg>
          要改的文件
        </div>
        <div class="fld" id="f2" data-shadow="0">
          <svg viewBox="0 0 64 64" fill="none" stroke="#161616" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
            <rect x="6" y="6" width="52" height="52" rx="6"/><path d="M18 33 L28 43 L46 22"/>
          </svg>
          配的测试
        </div>
      </div>
      <div class="cap" id="cap">固定五步</div>
      <div class="step st" data-shadow="0"><span class="num">1</span>写测试</div>
      <div class="step st" data-shadow="0"><span class="num">2</span>跑，失败<span class="lamp" id="red">FAIL</span></div>
      <div class="step st" data-shadow="0"><span class="num">3</span>写代码</div>
      <div class="step st" data-shadow="0"><span class="num">4</span>跑，通过<span class="lamp" id="green">PASS</span></div>
      <div class="step st" data-shadow="0"><span class="num">5</span>提交</div>
    </div>

    <div class="chip" id="tdd" data-r="-2">TDD 三步<br>写在计划里</div>
  </div>
</div>
<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  // 时刻按实测（2026-10-06，frame-times.py）：
  // 140 句 0，141 句 2.72（OpenSpec 的任务清单），142 句 6.72（拆成一个个开发任务），
  // 143 句 12.40（要改哪些文件 13.84，配哪个测试 15.92），144 句 18.16（固定的几步），
  // 145 句 21.04（写测试 21.28，跑 22.24，看它失败 23.04），146 句 24.40（写代码 24.56，跑 25.68，看它通过 26.40），
  // 147 句 27.84（提交 28.16），148 句 30.00（TDD 写在计划里）。
  var BEATS = {
    todo: 2.72,
    split: 6.72,
    expand: 12.40, f1: 13.84, f2: 15.92,
    steps: 18.16,
    lit: [21.28, 22.24, 24.56, 25.68, 28.16],   // 五步各自点亮：念到哪步亮哪步
    red: 23.04, green: 26.40,                     // 「看它失败」「看它通过」
    tdd: 30.00
  };

  // 点亮一步：p=0 浅灰字、空心编号；p=1 墨字、琥珀编号。
  function light(el, p) {
    var e = T.ease(p);
    el.style.color = T.mix([160, 157, 151], [22, 22, 22], e);
    var n = el.querySelector('.num');
    n.style.background = T.mix([242, 239, 230], [242, 155, 80], e);
    n.style.borderColor = T.mix([160, 157, 151], [22, 22, 22], e);
    n.style.color = T.mix([160, 157, 151], [22, 22, 22], e);
  }
  // 黄框只在 [on, off) 之间亮，讲到下一个就淡出。
  function cur(el, on, off, t) {
    T.current(el, T.ease(T.p(t, on, 0.3)) * (1 - T.ease(T.p(t, off, 0.3))));
  }
  // 卡内紧排的行用小一号的「当前」：黄描边离元素 2px，外加 3px 墨边，总共外扩 10px，
  // 不压到上下相邻的行（T.current 外扩 30px，会盖住邻行）。
  function curSmall(el, on, off, t) {
    var g = T.ease(T.p(t, on, 0.3)) * (1 - T.ease(T.p(t, off, 0.3)));
    el.style.outline = '5px solid rgba(245,207,74,' + g + ')';
    el.style.outlineOffset = '2px';
    el.style.boxShadow = '0 0 0 2px rgba(242,239,230,' + g + '), 0 0 0 10px rgba(22,22,22,' + g + '), 0 0 30px rgba(245,207,74,' + (0.5 * g) + ')';
  }

  Stage({
    duration: 32,
    init: function () { return T.fonts(document.getElementById('stage').textContent); },
    render: function (t) {
      // 140：第一件事，写计划。
      T.enter(T.$('head'), T.p(t, 0.2, 0.5), 12);

      // 141：OpenSpec 的任务清单，列的是要做什么。
      T.enter(T.$('todo'), T.p(t, BEATS.todo, 0.5), 20);
      T.items('.tr', BEATS.todo + 0.4, 0.2, t, 8);
      cur(T.$('todo'), BEATS.todo + 0.2, BEATS.split, t);

      // 142：Superpowers 把它拆细，拆成一个个开发任务。
      T.wipe(T.$('arw'), T.p(t, BEATS.split, 0.5), 'x');
      T.enter(T.$('zone'), T.p(t, BEATS.split + 0.3, 0.5), 20);
      T.items('.tcard', BEATS.split + 0.8, 0.35, t, 14);

      // 143：每个任务写清楚：要改哪些文件，配哪个测试。任务 1 展开。
      T.wipe(T.$('link'), T.p(t, BEATS.expand, 0.3), 'x');
      T.enter(T.$('detail'), T.p(t, BEATS.expand + 0.2, 0.5), 20);
      cur(T.$('t1'), BEATS.expand, BEATS.f1, t);
      T.enter(T.$('f1'), T.p(t, BEATS.f1, 0.4), 10);
      T.enter(T.$('f2'), T.p(t, BEATS.f2, 0.4), 10);
      curSmall(T.$('f1'), BEATS.f1, BEATS.f2, t);
      curSmall(T.$('f2'), BEATS.f2, BEATS.steps, t);

      // 144：固定的几步（先出来，没点亮）。
      T.enter(T.$('cap'), T.p(t, BEATS.steps, 0.4), 8);
      T.items('.st', BEATS.steps + 0.3, 0.15, t, 8);

      // 145–147：念到哪步亮哪步；两个「跑」的结果灯变红、变绿。
      var rows = T.all('.st');
      for (var i = 0; i < rows.length; i++) {
        light(rows[i], T.p(t, BEATS.lit[i], 0.4));
        curSmall(rows[i], BEATS.lit[i], i < rows.length - 1 ? BEATS.lit[i + 1] : BEATS.tdd, t);
      }
      T.fill(T.$('red'), [229, 83, 75], T.p(t, BEATS.red, 0.5));
      T.fill(T.$('green'), [76, 195, 138], T.p(t, BEATS.green, 0.5));

      // 148：测试驱动开发那三步，直接写在计划里。
      T.enter(T.$('tdd'), T.p(t, BEATS.tdd, 0.5), -14);
      cur(T.$('tdd'), BEATS.tdd + 0.2, 99, t);
    }
  });
</script>
</body>
</html>
