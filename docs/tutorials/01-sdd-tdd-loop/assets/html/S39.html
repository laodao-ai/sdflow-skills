<!-- S39 · 机制动画 · script 202–204「第一步，用 OpenSpec 做规划。……这里不用 `/opsx:apply` 命令。」
     S38 流程图原样不动（同一布局、同一倾角），只换灯：第一步 = 左边 OpenSpec 规划区亮，
     黄色描边 + 外发光标它是当前段；其它两区和两条箭头压暗到 0.6，仍看得清，观众知道还是那张图。
     批注都贴在图外的空白处，不改图本身：上方 `/opsx:explore` → `/opsx:propose` 两张命令卡，从 propose 拉蓝箭头指进规划区
     （箭头取它进入的区块色，同 S38）；命令卡右边 `/opsx:apply` 用墨线划掉（划掉 = 这里不用，不是「错」，所以用墨不用红），
     旁边白色虚线说明「这里不用」（虚线框 = 注意事项，同 S38 的非官方说明）。
     2026-10-06：Superpowers 区随 S38 改成「写计划 / 按计划做」；`/opsx:apply` 和「这里不用」从图下方（压在字幕带里）
     挪到上方空白处，时间轴没动。
     2026-10-06 全稿改口语：203 句改成「先敲 explore 把需求聊清楚，再敲 propose」，命令卡加 `/opsx:explore`，两张卡缩到 32px 并排，
     apply 与「这里不用」往右挪。
     时刻按实测（2026-10-06，frame-times.py）：202 句 0–2.56，203 句 3.52–12.16，204 句 13.44–14.80。 -->
<html lang="zh-CN" data-frame-id="S39">
<head>
<meta charset="utf-8">
<title>S39 · 第一步</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* —— S38 流程图（照搬母版尺寸，不改） —— */
  .zone {
    position: absolute; top: 230px; height: 660px; box-sizing: border-box;
    padding: 64px 28px 28px; border-radius: 12px; border: 6px solid var(--ink);
    box-shadow: 16px 16px 0 var(--ink);
  }
  .zone.os { background: var(--blue-fill); }
  .zone.sp { background: var(--amber-fill); }
  .zone > .tab { font-size: 54px; color: var(--ink); }
  .sub { font-family: var(--display); font-weight: 800; font-size: 40px; color: var(--blue-soft); }
  .files { position: relative; height: 190px; margin-top: 12px; }
  .file {
    position: absolute; width: 180px; padding: 12px 0; border-radius: 6px; background: var(--cream); text-align: center;
    border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
    font-family: var(--mono); font-size: 30px; color: var(--ink);
  }
  .stop { position: absolute; left: 110px; top: 360px; width: 210px; height: 210px; }
  .stop svg { position: absolute; inset: 0; }
  .stop span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; font-family: var(--display); font-weight: 800; font-size: 42px;
    line-height: 1.12; color: var(--ink);
  }
  .step {
    display: flex; align-items: center; gap: 18px; padding: 16px 22px;
    border-radius: 8px; background: var(--cream); color: var(--ink);
    border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
    font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1.15;
  }
  .zone .num { width: 58px; height: 58px; border-width: 4px; font-size: 30px; background: var(--amber); }
  .tdd {
    display: flex; border-radius: 8px; overflow: hidden;
    border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); background: var(--cream);
  }
  .tdd .half {
    flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px;
    padding: 16px 12px; font-family: var(--display); font-weight: 800; font-size: 36px; color: var(--ink);
    white-space: nowrap;
  }
  .tdd .half + .half { border-left: 5px solid var(--ink); }
  /* 第 2 步「按计划做」：标题一行 + 红绿一行，竖排在同一张卡里 */
  .step.do { flex-direction: column; align-items: stretch; gap: 14px; }
  .do .dohead { display: flex; align-items: center; gap: 18px; }
  .do .tdd { box-shadow: 5px 5px 0 var(--ink); }
  .tdd .half small { font-family: var(--mono); font-weight: 700; font-size: 26px; }
  #red { background: var(--fail); }
  #green { background: var(--pass); }
  .down { display: flex; justify-content: center; height: 62px; align-items: center; }
  .down svg { width: 44px; height: 38px; }
  .boxes { display: flex; gap: 16px; padding: 18px 22px; border-radius: 8px; background: var(--cream);
    border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); }
  .box { width: 64px; height: 64px; box-sizing: border-box; border-radius: 6px; border: 6px solid var(--ink); position: relative; background: #fff; }
  .box svg { position: absolute; left: -6px; top: -18px; width: 78px; height: 78px; }
  .boxes-cap { margin: 14px 0 0 6px; font-family: var(--display); font-weight: 800; font-size: 44px; color: #fff; }
  .arc svg { width: 56px; height: 56px; flex: none; }
  .arw { position: absolute; top: 500px; width: 150px; height: 90px; }
  #note { right: 70px; top: 70px; }

  /* —— 本帧批注 —— */
  #explore { left: 70px; top: 66px; padding: 12px 26px; font-size: 32px; }
  #eArw { position: absolute; left: 392px; top: 92px; width: 70px; height: 50px; }
  #propose { left: 470px; top: 66px; padding: 12px 26px; font-size: 32px; }
  #pArw { position: absolute; left: 430px; top: 146px; width: 120px; height: 160px; }
  #apply {
    left: 860px; top: 84px; padding: 10px 26px; border-radius: 8px; white-space: nowrap;
    background: var(--cream); color: var(--ink); border: 4px solid var(--ink); box-shadow: 7px 7px 0 var(--ink);
    font-family: var(--mono); font-weight: 700; font-size: 36px;
  }
  /* 划线：墨色粗线（「不用」不是测试失败，所以不用红）。 */
  #applyX { left: -12px; right: -12px; top: 50%; height: 9px; margin-top: -4px; background: var(--ink); border-radius: 5px; }
  #skip { left: 1200px; top: 92px; font-size: 34px; }
</style>
</head>
<body>
<div id="stage">
  <div class="tag" id="note" data-r="-4">照两边文档接的 · 非官方</div>

  <!-- 第一步：OpenSpec 规划，然后停下 -->
  <div class="zone os" id="zA" data-r="-1.2" data-shadow="16" style="left:70px;width:450px">
    <div class="tab os">OpenSpec</div>
    <div class="sub">规划</div>
    <div class="files" id="files">
      <div class="file" data-r="-3" style="left:0;top:0">proposal</div>
      <div class="file" data-r="2.5" style="left:206px;top:10px">specs/</div>
      <div class="file" data-r="2" style="left:8px;top:94px">design</div>
      <div class="file" data-r="-2" style="left:200px;top:100px">tasks</div>
    </div>
    <div class="stop" id="stop" data-r="-7">
      <svg viewBox="0 0 210 210"><polygon points="62,4 148,4 206,62 206,148 148,206 62,206 4,148 4,62" fill="#161616"/>
        <polygon points="64,10 146,10 200,64 200,146 146,200 64,200 10,146 10,64" fill="#f2efe6"/>
        <polygon points="68,20 142,20 190,68 190,142 142,190 68,190 20,142 20,68" fill="none" stroke="#161616" stroke-width="5"/></svg>
      <span>然后<br>停下</span>
    </div>
  </div>

  <svg class="arw" id="a1" style="left:536px" viewBox="0 0 150 90">
    <path d="M24 50 Q 70 30 112 44" fill="none" stroke="#161616" stroke-width="20" stroke-linecap="round"/>
    <path d="M24 50 Q 70 30 112 44" fill="none" stroke="#f29b50" stroke-width="12" stroke-linecap="round"/>
    <circle cx="18" cy="52" r="14" fill="#f29b50" stroke="#161616" stroke-width="5"/>
    <polygon points="100,18 146,50 102,78" fill="#f29b50" stroke="#161616" stroke-width="5" stroke-linejoin="round"/>
  </svg>

  <!-- 第二、三步：Superpowers -->
  <div class="zone sp" id="zB" data-r="0.8" data-shadow="16" style="left:704px;width:540px">
    <div class="tab sp">Superpowers</div>
    <div class="step" id="seg2" data-r="-1.5" data-shadow="8" style="margin-top:22px"><div class="num">1</div>写计划</div>
    <div class="down" id="down2"><svg viewBox="0 0 44 38"><path d="M5 7 L22 29 L39 7" fill="none" stroke="#f29b50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <!-- 第 2 步「按计划做」：每一项都先写测试，再写实现，所以红绿一行装在这张卡里 -->
    <div class="step do" id="seg3" data-r="1.5" data-shadow="8">
      <div class="dohead"><div class="num">2</div>按计划做</div>
      <div class="tdd">
        <div class="half" id="red">先写测试<small>FAIL</small></div>
        <div class="half" id="green">再写实现<small>PASS</small></div>
      </div>
    </div>
  </div>

  <svg class="arw" id="a2" style="left:1262px" viewBox="0 0 150 90">
    <path d="M24 44 Q 70 62 112 46" fill="none" stroke="#161616" stroke-width="20" stroke-linecap="round"/>
    <path d="M24 44 Q 70 62 112 46" fill="none" stroke="#43a0ed" stroke-width="12" stroke-linecap="round"/>
    <circle cx="18" cy="42" r="14" fill="#43a0ed" stroke="#161616" stroke-width="5"/>
    <polygon points="100,18 146,46 102,74" fill="#43a0ed" stroke="#161616" stroke-width="5" stroke-linejoin="round"/>
  </svg>

  <!-- 第四步：回到 OpenSpec 收尾 -->
  <div class="zone os" id="zC" data-r="1.4" data-shadow="16" style="left:1420px;width:440px">
    <div class="tab os">OpenSpec</div>
    <div class="sub">收尾</div>
    <div class="boxes" id="boxes" data-r="-1.5" data-shadow="8" style="margin-top:22px">
      <div class="box" style="transform:rotate(-3deg)"><svg class="tick" viewBox="0 0 78 78"><path d="M16 40 L32 56 L66 14" fill="none" stroke="#43a0ed" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="box" style="transform:rotate(2deg)"><svg class="tick" viewBox="0 0 78 78"><path d="M16 40 L32 56 L66 14" fill="none" stroke="#43a0ed" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="box" style="transform:rotate(-1deg)"><svg class="tick" viewBox="0 0 78 78"><path d="M16 40 L32 56 L66 14" fill="none" stroke="#43a0ed" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="box" style="transform:rotate(3deg)"><svg class="tick" viewBox="0 0 78 78"><path d="M16 40 L32 56 L66 14" fill="none" stroke="#43a0ed" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <div class="down"><svg viewBox="0 0 44 38"><path d="M5 7 L22 29 L39 7" fill="none" stroke="#43a0ed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="step arc" id="archive" data-r="2">
      <svg viewBox="0 0 56 56" fill="none" stroke="#161616" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

      归档

  <!-- 本帧批注：explore → propose，命令进规划区；apply 划掉 -->
  <div class="cmd" id="explore" data-r="-1.5">/opsx:explore</div>
  <svg id="eArw" viewBox="0 0 70 50">
    <path d="M6 25 H 44" fill="none" stroke="#161616" stroke-width="16" stroke-linecap="round"/>
    <path d="M6 25 H 44" fill="none" stroke="#43a0ed" stroke-width="9" stroke-linecap="round"/>
    <polygon points="40,8 66,25 40,42" fill="#43a0ed" stroke="#161616" stroke-width="4" stroke-linejoin="round"/>
  </svg>
  <div class="cmd" id="propose" data-r="-1.5">/opsx:propose</div>
  <svg id="pArw" viewBox="0 0 120 160">
    <path d="M92 18 Q 96 80 50 116" fill="none" stroke="#161616" stroke-width="20" stroke-linecap="round"/>
    <path d="M92 18 Q 96 80 50 116" fill="none" stroke="#43a0ed" stroke-width="12" stroke-linecap="round"/>
    <circle cx="92" cy="16" r="14" fill="#43a0ed" stroke="#161616" stroke-width="5"/>
    <polygon points="34,98 66,128 22,150" fill="#43a0ed" stroke="#161616" stroke-width="5" stroke-linejoin="round"/>
  </svg>

  <div class="tag" id="skip" data-r="-3">这里不用</div>

<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  var DIM = 0.6;
  // 亮 → 暗：S38 结束时整张图全亮，这一帧开头 0.5 秒把非当前段压暗。
  function dim(el, t) { el.style.opacity = 1 - (1 - DIM) * T.ease(T.p(t, 0, 0.5)); }

  Stage({
    duration: 15,
    init: function () { return T.fonts('规划然后停下写计划按做先写测试再实现收尾勾掉任务归档照两边文档接的非官方这里不用'); },
    render: function (t) {
      T.tilt();
      ['zB', 'zC', 'a1', 'a2'].forEach(function (id) { dim(T.$(id), t); });
      T.current(T.$('zA'), T.ease(T.p(t, 0.1, 0.4)));

      // 203 句（3.52 秒开口）：先敲 /opsx:explore 聊清楚，再敲 /opsx:propose → 出四个文档
      T.enter(T.$('explore'), T.p(t, 4.4, 0.4), -14);
      T.enter(T.$('propose'), T.p(t, 8.48, 0.4), -14);
      T.wipe(T.$('eArw'), T.p(t, 7.92, 0.3), 'x');
      T.wipe(T.$('pArw'), T.p(t, 10.16, 0.5), 'y');

      // 停下：停牌放大一下再落回（11.44 秒念到「然后停下」）
      var k = T.p(t, 11.44, 0.6);
      var s = 1 + 0.12 * Math.sin(Math.PI * k);
      T.$('stop').style.transform = 'rotate(-7deg) scale(' + s + ')';

      // 不用 /opsx:apply：出现、划掉、注明
      // 204 句（13.44 秒开口；念到 apply 14.16 秒，念完 14.80 秒）
      T.enter(T.$('apply'), T.p(t, 13.44, 0.4), 14);
      T.strike(T.$('applyX'), T.p(t, 14.16, 0.4));
      T.enter(T.$('skip'), T.p(t, 14.48, 0.4), 12);
    }
  });
</script>
