  .zone {

    <div class="tab os">OpenSpec</div>
    <div class="sub">规划</div>
    <div class="files" id="files">

      <div class="file" data-r="-2" style="left:200px;top:100px">tasks</div>

      <svg viewBox="0 0 210 210"><polygon points="62,4 148,4 206,62 206,148 148,206 62,206 4,148 4,62" fill="#161616"/>
        <polygon points="64,10 146,10 200,64 200,146 146,200 64,200 10,146 10,64" fill="#f2efe6"/>

  <svg class="arw" id="a1" style="left:536px" viewBox="0 0 150 90">

    <div class="down" id="down2"><svg viewBox="0 0 44 38"><path d="M5 7 L22 29 L39 7" fill="none" stroke="#f29b50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <div class="step do" id="seg3" data-r="1.5" data-shadow="8">

    <path d="M24 44 Q 70 62 112 46" fill="none" stroke="#43a0ed" stroke-width="12" stroke-linecap="round"/>

  <!-- 第四步：回到 OpenSpec 收尾 -->
  <div class="zone os" id="zC" data-r="1.4" data-shadow="16" style="left:1420px;width:440px">

      <div class="box" style="transform:rotate(2deg)"><svg class="tick" viewBox="0 0 78 78"><path d="M16 40 L32 56 L66 14" fill="none" stroke="#43a0ed" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  var DIM = 0.6;
  // 亮 → 暗：上一帧结束时这几段是亮的，开头 0.5 秒把非当前段压暗。
  function dim(el, t) { el.style.opacity = 1 - (1 - DIM) * T.ease(T.p(t, 0, 0.5)); }

  var ticks = T.all('#zC .tick');

  Stage({
    duration: 14.5,
    init: function () { return T.fonts('规划然后停下写计划按做先写测试再实现收尾勾掉任务归档照两边文档接的非官方需先打开'); },
    render: function (t) {
      T.tilt();
      ['zA', 'zB', 'a1', 'a2'].forEach(function (id) { dim(T.$(id), t); });
      T.current(T.$('zC'), T.ease(T.p(t, 0.1, 0.4)));

      // 209 句：先敲 /opsx:verify 核对一遍（时刻按 2026-10-07 补录后实测）
      T.enter(T.$('verifyCmd'), T.p(t, 3.75, 0.4), -14);
      T.wipe(T.$('vArw'), T.p(t, 4.87, 0.5), 'x');

      // 没勾的任务让它勾上：贴上 tasks.md，勾先淡掉再逐个勾回
      T.enter(T.$('tasksLbl'), T.p(t, 5.75, 0.4), -12);
      var clear = T.ease(T.p(t, 5.99, 0.3));
      for (var i = 0; i < ticks.length; i++) {
        var p = T.ease(T.p(t, 6.95 + i * 0.3, 0.3));
        ticks[i].style.clipPath = 'inset(0 ' + ((1 - Math.max(p, 1 - clear)) * 100) + '% 0 0)';
      }
      // 再敲 /opsx:archive 归档
      T.enter(T.$('archCmd'), T.p(t, 8.47, 0.4), 14);

      // 210 句：verify 跟 ff 一样，得先打开才有
      T.enter(T.$('needOn'), T.p(t, 11.00, 0.4), 12);
    }
  });
</script>
