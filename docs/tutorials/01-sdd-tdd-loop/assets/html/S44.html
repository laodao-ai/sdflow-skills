<script>
  var S = 0.6, TX = 379.6, TY = -90;
  function shrink(e) {
    T.$('flow').style.transform = 'translate(' + (TX * e) + 'px,' + (TY * e) + 'px) scale(' + (1 - (1 - S) * e) + ')';
    T.$('note').style.opacity = 1 - e;
  }
  // 换灯：每段的亮度从 from 渐变到 to（1 = 亮，0.6 = 压暗）。
  var PARTS = ['zA', 'a1', 'zB', 'seg2', 'down2', 'seg3', 'a2', 'zC'];
  function relight(from, to, e) {
    PARTS.forEach(function (id) {
      var a = from[id] === undefined ? 1 : from[id], b = to[id] === undefined ? 1 : to[id];
      T.$(id).style.opacity = a + (b - a) * e;
    });
  }

  // S43 结束时：只亮「按计划做」（先写测试 / 再写实现）。
  var FROM = { zA: 0.6, a1: 0.6, seg2: 0.6, down2: 0.6, a2: 0.6, zC: 0.6 };
  // 两份清单各出在「写计划」和收尾区：亮这两处。
  var TO = { zA: 0.6, a1: 0.6, down2: 0.6, seg3: 0.6, a2: 0.6 };
  var pt = T.all('.pt'), stamps = T.all('.stamp');
  function tick(el, p) { el.style.clipPath = 'inset(0 ' + ((1 - T.ease(p)) * 100) + '% 0 0)'; }

  Stage({
    duration: 7,
    init: function () { return T.fonts('规划然后停下写计划按做先写测试再实现收尾勾掉任务归档注意两份清单不会自动同步进度任务已审'); },
    render: function (t) {
      T.tilt();
      shrink(1);
      relight(FROM, TO, T.ease(T.p(t, 0, 0.6)));

      T.enter(T.$('h2'), T.p(t, 0.0, 0.4), -12);
      T.enter(T.$('h2t'), T.p(t, 0.72, 0.4), -12);

      // 两边并排：Superpowers 三个任务做完、审过，tasks.md 不跟着勾
      T.enter(T.$('plan'), T.p(t, 3.04, 0.5), 24);
      T.enter(T.$('tasks'), T.p(t, 4.8, 0.5), 24);
      for (var i = 0; i < pt.length; i++) {
        tick(pt[i], T.p(t, 4.08 + i * 0.35, 0.3));
        T.enter(stamps[i], T.p(t, 4.28 + i * 0.35, 0.3), -10);
      }
      T.wipe(T.$('link'), T.p(t, 6.32, 0.5), 'x');
    }
  });
</script>
