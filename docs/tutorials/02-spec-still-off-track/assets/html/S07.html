<script>
  // ===== 模版共用：按 <html> 属性搭第一级。要在 theme.js 之前跑：自动倾角只认加载时已有的元素。 =====
  (function () {
    var STEPS = ['需求明确', '规格编写', '规格评审', '代码实现', '代码评审', '收尾归档'];
    var EP = [2, 2, 3, 4, 5, 6];   // 每步对应第几期（visual-v4 4.9）
    var root = document.documentElement;
    var level = root.getAttribute('data-level') === '2' ? 2 : 1;
    function list(name) {
      return (root.getAttribute(name) || '').split(',').map(function (s) { return Number(s.trim()); }).filter(Boolean);
    }
    var done = list('data-done'), cur = list('data-current');
    // 第一级的几何：level 1 放大居中偏上，level 2 缩到顶部一行。两种都左右对称（中心 x 960）。
    var G = level === 1
      ? { left: 55, top: 330, w: 280, h: 104, gap: 26, epGap: 26 }
      : { left: 187, top: 24, w: 236, h: 64, gap: 26, epGap: 24 };
    var sf = document.getElementById('sf');
    var html = '';
    for (var i = 0; i < 6; i++) {
      var n = i + 1;
      var st = cur.indexOf(n) >= 0 ? 'now' : done.indexOf(n) >= 0 ? 'done' : 'off';
      html += '<div class="card sf-step ' + st + '" id="sf' + n + '" data-shadow="' + (level === 1 ? 10 : 7) + '" style="left:' +
        (G.left + i * (G.w + G.gap)) + 'px;top:' + G.top + 'px"><span class="num">' + n + '</span><span class="big">' + STEPS[i] + '</span></div>';
    }
    // 期号：同一期相邻的几步合成一个括线。
    var a = 0, curL = 9999, curR = 0;
    while (a < 6) {
      var b = a;
      while (b + 1 < 6 && EP[b + 1] === EP[a]) b++;
      var isNow = false;
      for (var k = a; k <= b; k++) if (cur.indexOf(k + 1) >= 0) isNow = true;
      var l = G.left + a * (G.w + G.gap), r = G.left + b * (G.w + G.gap) + G.w;
      if (isNow) { curL = Math.min(curL, l); curR = Math.max(curR, r); }
      html += '<div class="sf-ep' + (isNow ? ' now' : '') + '" id="sfe' + EP[a] + '" style="left:' + l + 'px;width:' + (r - l) +
        'px;top:' + (G.top + G.h + G.epGap) + 'px">第 ' + EP[a] + ' 期</div>';
      a = b + 1;
    }
    sf.innerHTML = html;
    // 第二级：从「当前」那组的期号括线下沿，两条线连到外框上沿两角。
    if (level === 2 && curR > 0) {
      var y0 = G.top + G.h + G.epGap + 32;
      document.getElementById('sf-fan').innerHTML =
        '<path d="M' + (curL + 10) + ' ' + y0 + ' L48 174 M' + (curR - 10) + ' ' + y0 + ' L1872 174" fill="none" ' +
        'stroke="rgba(22,22,22,.4)" stroke-width="3" stroke-linecap="round"/>';
    }
    window.SF_LEVEL = level;
  })();
</script>

    Array.prototype.slice.call(document.querySelectorAll('.doc')).forEach(function (el) {
      var w = parseFloat(el.style.width), h = parseFloat(el.style.height), e = 2.5;
      var body = 'M' + e + ' ' + e + ' H' + (w - F) + ' L' + (w - e) + ' ' + F + ' V' + (h - e) + ' H' + e + ' Z';
      var fold = 'M' + (w - F) + ' ' + e + ' V' + F + ' H' + (w - e);
      el.insertAdjacentHTML('afterbegin', '<svg class="dsh" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
        '<path class="body" d="' + body + '"/><path class="fold" d="' + fold + '" fill="none"/></svg>');
    });
  })();
</script>
<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  // ===== 模版共用：动画小工具 =====
  var SF = (function () {
    var DIM = [160, 157, 151], INK = [22, 22, 22], CREAM = [242, 239, 230], NOTYET = [63, 66, 70];
    // 没讲到 → 讲过：透明底淡墨描边淡墨字 → 奶白底墨描边墨字（同目录页 S05）。里面的 .num 跟着变。
    function lit(el, p) {
      var c = T.mix(NOTYET, INK, p);
      [el].concat(Array.prototype.slice.call(el.querySelectorAll('.num'))).forEach(function (e) {
        e.style.background = 'rgba(242,239,230,' + p + ')';
        e.style.borderColor = c;
        e.style.color = c;
      });
    }
    // 讲过 → 被留下：奶白 → 灰实心。
    function gray(el, p) { el.style.background = T.mix(CREAM, DIM, p); }
    // 「当前」描边。a = 硬投影的不透明度（不传 = 1）：透明底的空框传它的点亮进度，免得没讲到时露出实心投影。
    function cur(el, g, s, a) {
      // s 传 0 = 不要硬投影（进度点）；不传就读 data-shadow，再没有用 10。
      T.current(el, g, s != null ? s : parseFloat(el.getAttribute('data-shadow') || '10'));
      // 浏览器读回来的颜色是 rgb(22, 22, 22) 不是 #161616，两种写法都要认。
      if (a != null) el.style.boxShadow = el.style.boxShadow.replace(/#161616|rgb\(22, 22, 22\)/g, 'rgba(22,22,22,' + a + ')');
    }
    // 横箭头：从 x1 到 x2（箭头尖），竖直中心 y。
    function arrow(el, x1, x2, y) {
      el.style.left = x1 + 'px';
      el.style.width = Math.max(0, x2 - x1 - 18) + 'px';
      el.style.top = (y - 3) + 'px';
    }
    function lerp(a, b, p) { return a + (b - a) * p; }
    // 第一级进场：tIn 起六步依次落下、期号和外框淡入；tCur 起「当前」那几步加黄框。
    function l1(t, tIn, tCur) {
      for (var i = 1; i <= 6; i++) {
        var el = T.$('sf' + i);
        T.enter(el, T.p(t, tIn + (i - 1) * 0.08, 0.5), window.SF_LEVEL === 1 ? 20 : 12);
        if (el.classList.contains('now')) cur(el, T.ease(T.p(t, tCur, 0.4)));
      }
      var e = T.ease(T.p(t, tIn + 0.3, 0.6));
      T.all('.sf-ep').forEach(function (x) { x.style.opacity = e; });
      T.$('sf-fan').style.opacity = e;
      T.$('sf-frame').style.opacity = e;
    }
    return { lit: lit, gray: gray, cur: cur, arrow: arrow, lerp: lerp, l1: l1 };
  })();
  // ===== 模版共用到此 =====

  // ===== 新流程图（共用块）=====
  // NF.show(t)：S07 的点亮时间轴（t = S07 的本页时刻）。S08、S29 调 NF.show(999) 得到 S07 终帧的样子，再缩放。
  var NF = (function () {
    var NOTYET = [63, 66, 70], INK = [22, 22, 22], CREAM = [242, 239, 230], BLUE = [67, 160, 237];
    // S07 的时刻（秒）。对应的句子见 S07 文件头注释。按录音实测（frame-times.py，2026-10-19）。
    // 2026-10-18：原第 29 句（角标）删去，NOTE 改名 END = 第 26 句念完前规格的「当前」淡出。
    var C = { NEWIN: 1.6, SDF: 2.9, EXP: 5.5, CLR: 11.6, MEMO: 15.6, GRILL: 17.9, FILL: 23.5,
              ADR: 25.9, ADR2: 29.5, WRITE: 32.7, SPEC: 34.5, END: 35.6 };
    // 箭头：起点 → 箭头尖（画布坐标，S07 大图）。
    var A = {
      a1: [518, 460, 576, 460],   // explore → 澄清（箭头尖离目标 14px：目标标「当前」时，描边外圈只压住箭头尖一点）
      a2: [778, 460, 836, 460],   // 澄清 → 纪要
      a3: [975, 540, 975, 636],   // 纪要 ↓ 拷问：拷问读纪要
      a4: [1055, 642, 1055, 544], // 拷问 ↑ 纪要：每定一条写回纪要
      a5: [1190, 460, 1526, 460], // 纪要 → 规格：一次写成
      a6: [1123, 690, 1236, 655], // 拷问 → ADR
      a7: [1123, 730, 1236, 766], // 拷问 → 术语表
      a8: [1458, 640, 1617, 546], // ADR → 规格
      a9: [1458, 770, 1716, 546]  // 术语表 → 规格
    };
    function geom() {
      Object.keys(A).forEach(function (id) {
        var a = A[id], dx = a[2] - a[0], dy = a[3] - a[1], L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L;
        var bx = a[2] - ux * 20, by = a[3] - uy * 20;   // 箭头底边中点
        var g = T.$(id);
        var p = g.querySelector('path');
        p.setAttribute('d', 'M' + a[0] + ' ' + a[1] + ' L' + (a[2] - ux * 16) + ' ' + (a[3] - uy * 16));
        p.setAttribute('stroke', 'currentColor'); p.setAttribute('stroke-width', '6'); p.setAttribute('stroke-linecap', 'round');
        g.querySelector('polygon').setAttribute('points', a[2] + ',' + a[3] + ' ' + (bx - uy * 12) + ',' + (by + ux * 12) + ' ' + (bx + uy * 12) + ',' + (by - ux * 12));
        g.querySelector('polygon').setAttribute('fill', 'currentColor');
      });
    }
    // 文档：没讲到（淡墨描边、淡墨字）→ 讲过（蓝区底、蓝边、奶白字）。硬投影随点亮显出来。
    function docLit(el, p) {
      var st = T.mix(NOTYET, BLUE, p);
      el.querySelector('.dsh').style.filter = 'drop-shadow(10px 10px 0 rgba(22,22,22,' + p + '))';
      var b = el.querySelector('.body'), f = el.querySelector('.fold');
      b.style.fill = 'rgba(30,51,73,' + p + ')'; b.style.stroke = st; f.style.stroke = st;
      el.style.color = T.mix(NOTYET, CREAM, p);
    }
    function aLit(id, p) { T.$(id).style.color = T.mix(NOTYET, INK, p); }
    function span(t, a, b) { return T.ease(T.p(t, a, 0.4)) * (1 - T.ease(T.p(t, b, 0.3))); }
    function act(el, t, t0, g) { var p = T.ease(T.p(t, t0, 0.4)); SF.lit(el, p); SF.cur(el, g, 10, p); }
    function doc(el, t, t0, g) { docLit(el, T.ease(T.p(t, t0, 0.4))); SF.cur(el, g, 0); }

    function show(t) {
      geom();
      var c = C;
      // 整张图暗着进场（动作卡、文档的描边和箭头都是淡墨）。
      ['n1', 'n2', 'd1', 'n3', 'd2', 'd3', 'd4'].forEach(function (id, i) { T.enter(T.$(id), T.p(t, c.NEWIN + i * 0.1, 0.5), 14); });
      Object.keys(A).forEach(function (id, k) { T.$(id).style.opacity = T.ease(T.p(t, c.NEWIN + 0.2 + k * 0.06, 0.4)); aLit(id, 0); });
      T.enter(T.$('laneN'), T.p(t, c.SDF, 0.5), 14);
      // 名字的全称只上画面不念（作者 2026-10-19 定）
      T.enter(T.$('sdfFull'), T.p(t, c.SDF + 0.4, 0.5), 10);

      act(T.$('n1'), t, c.EXP, span(t, c.EXP, c.CLR));
      act(T.$('n2'), t, c.CLR, span(t, c.CLR, c.MEMO));
      aLit('a1', T.ease(T.p(t, c.CLR, 0.4)));
      doc(T.$('d1'), t, c.MEMO, Math.max(span(t, c.MEMO, c.GRILL), span(t, c.WRITE, c.SPEC)));
      aLit('a2', T.ease(T.p(t, c.MEMO, 0.4)));
      T.enter(T.$('draft'), T.p(t, c.MEMO + 0.3, 0.4), 10);
      act(T.$('n3'), t, c.GRILL, span(t, c.GRILL, c.ADR2));
      aLit('a3', T.ease(T.p(t, c.GRILL, 0.4)));
      aLit('a4', T.ease(T.p(t, c.FILL, 0.4)));
      T.$('lbF').style.opacity = T.ease(T.p(t, c.FILL, 0.4));

      // ADR · 术语表：拷问分出两条箭头，两份文档亮，一起标「当前」。
      aLit('a6', T.ease(T.p(t, c.ADR, 0.4)));
      aLit('a7', T.ease(T.p(t, c.ADR + 0.15, 0.4)));
      doc(T.$('d2'), t, c.ADR2, 0);
      doc(T.$('d3'), t, c.ADR2 + 0.15, 0);
      SF.cur(T.$('adrg'), span(t, c.ADR2, c.WRITE), 0);
      T.$('keep').style.opacity = T.ease(T.p(t, c.ADR2 + 0.4, 0.4));

      // 纪要 → 一次写成规格；ADR、术语表指向规格的箭头同时出。
      aLit('a5', T.ease(T.p(t, c.WRITE, 0.4)));
      aLit('a8', T.ease(T.p(t, c.WRITE + 0.2, 0.4)));
      aLit('a9', T.ease(T.p(t, c.WRITE + 0.3, 0.4)));
      T.$('lbW').style.opacity = T.ease(T.p(t, c.WRITE, 0.4));
      doc(T.$('d4'), t, c.SPEC, span(t, c.SPEC, c.END));
      SF.cur(T.$('hlW'), 0, 0);
    }
    // 整张图缩放：s = 比例，(tx, ty) = 平移。比例 1、不平移时不写 transform，和 S07 逐像素一致。
    function place(s, tx, ty) {
      T.$('nf').style.transform = (s === 1 && tx === 0 && ty === 0) ? '' : 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    }
    return { C: C, show: show, place: place, span: span };
  })();

  // ===== 本页：帧脚本 =====
  // 时刻（秒，本页起算；按录音实测，frame-times.py，2026-10-19）。对应的句子见文件头注释。
  var MORPH = 0.0;
  var NOTYET = [63, 66, 70], INK = [22, 22, 22];

  // 旧路线：S06 终帧的位置 → 顶行的位置。[left, top, width, height]
  var BIG = [[90, 380, 390, 260], [540, 380, 390, 260], [990, 380, 390, 260], [1440, 380, 390, 260]];
  var SMALL = [[320, 196, 200, 64], [580, 196, 250, 64], [900, 196, 120, 64], [1090, 196, 250, 64]];
  // ml：标签先到顶行（0.3–0.8 秒），m：四张卡随后缩过去（0.5–1.7 秒）。错开是为了卡片移动时不压住标签。
  function oldRow(ml, m) {
    var lane = T.$('laneO');
    lane.style.left = SF.lerp(90, 60, ml) + 'px';
    lane.style.top = SF.lerp(270, 196, ml) + 'px';
    lane.style.fontSize = SF.lerp(44, 34, ml) + 'px';
    SF.gray(lane, ml);
    var fade = 1 - T.ease(Math.min(1, m * 2));
    for (var i = 0; i < 4; i++) {
      var el = T.$('o' + (i + 1)), b = BIG[i], s = SMALL[i];
      el.style.left = SF.lerp(b[0], s[0], m) + 'px';
      el.style.top = SF.lerp(b[1], s[1], m) + 'px';
      el.style.width = SF.lerp(b[2], s[2], m) + 'px';
      el.style.height = SF.lerp(b[3], s[3], m) + 'px';
      el.style.borderWidth = SF.lerp(5, 4, m) + 'px';
      el.querySelector('.ttl').style.fontSize = SF.lerp(56, 34, m) + 'px';
      ['.l1', '.sub', '.num'].forEach(function (q) { el.querySelector(q).style.opacity = fade; });
      SF.gray(el, m);
    }
    for (var k = 1; k <= 3; k++) {
      var l = SF.lerp(BIG[k - 1][0] + BIG[k - 1][2], SMALL[k - 1][0] + SMALL[k - 1][2], m) + 8;
      var r = SF.lerp(BIG[k][0], SMALL[k][0], m) - 8;
      var y = SF.lerp(510, 228, m);
      var a = T.$('oa' + k);
      SF.arrow(a, l, r, y);
      a.style.color = T.mix(INK, NOTYET, m);
    }
  }

  Stage({
    duration: 37.0,
    init: function () { return T.fonts(T.$('stage').textContent); },
    render: function (t) {
      T.tilt();   // 手写了 data-r、又不做进场动画的元素，先按 data-r 摆好倾角（theme.js 只给自动算角的元素摆）
      T.$('head').style.opacity = 1 - T.ease(T.p(t, 0.05, 0.3));   // S06 的卡头：标签移上来之前淡出
      oldRow(T.ease(T.p(t, MORPH, 0.5)), T.ease(T.p(t, MORPH + 0.2, 1.2)));

      // 新流程：整张暗着进场，随口播点亮（时间轴在共用块 NF.show）。
      NF.show(t);
    }
  });
</script>
