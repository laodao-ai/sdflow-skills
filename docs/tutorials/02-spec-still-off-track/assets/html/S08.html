<style>
  /* ===== 模版共用：复制后不改 ===== */
  /* 纸底（2026-10-20 作者定：只有章节标签页用深色底，其余页面都是纸底）。
     「没讲到」= 墨色 65% 不透明度，叠在渲染后的纸底 #8b949e 上约 #3f4246，对比度 3.28:1；CSS 写 --notyet，JS 里同值写 NOTYET。

  :root { --notyet: rgba(22,22,22,.65); }

  html[data-level="1"] .sf-step { width: 280px; height: 104px; }

  html[data-level="1"] .sf-step .num { width: 58px; height: 58px; font-size: 30px; }
  html[data-level="2"] .sf-step { width: 236px; height: 64px; border-width: 4px; padding: 0 12px; gap: 10px; }

  .sf-step.off .num { background: transparent; border-color: var(--notyet); color: var(--notyet); }

  html[data-level="1"] .sf-ep { font-size: 34px; }

     这样缩小上移后，容器和箭头层的外框不会越出画布（渲染前的越界检查会量容器本身）。 */
  #nf { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  #nfa { position: absolute; left: 500px; top: 440px; width: 1240px; height: 350px; overflow: visible; }

  .doc { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center;

    function show(t) {
      var c = T8, span = NF.span;
      SF.arrow(T.$('oa1'), 528, 572, 228); SF.arrow(T.$('oa2'), 838, 892, 228); SF.arrow(T.$('oa3'), 1028, 1082, 228);
      ['oa1', 'oa2', 'oa3'].forEach(function (id) { T.$(id).style.color = 'rgb(63,66,70)'; });   // 旧路线是被留下的：淡墨（同 S07 终帧）

      // 第 27 句：新流程缩小上移，分组框随即淡入。
      NF.show(999);
      var m = T.ease(T.p(t, c.SHR, 1.2));
      NF.place(SF.lerp(1, S, m), SF.lerp(0, TX, m), SF.lerp(0, TY, m));
      T.$('nfbox').style.opacity = T.ease(T.p(t, c.BOX, 0.5));

      // 三张卡暗着进场，贴纸飞回落到卡上；第 28–30 句依次亮起。
      var B = [c.B1, c.B2, c.B3], TT = [c.T1, c.T2, c.T3], NEXT = [c.B2, c.B3, c.END];
      for (var i = 0; i < 3; i++) {
        var card = T.$('c' + (i + 1));
        T.enter(card, T.p(t, c.CIN + i * 0.15, 0.5), 16);
        var lit = T.ease(T.p(t, B[i], 0.4));
        SF.lit(card, lit);
        card.querySelector('.num').style.background = T.mix([139, 148, 158], [242, 239, 230], lit);
        SF.cur(card, span(t, B[i], NEXT[i]), 10, lit);
        T.$('cn' + (i + 1)).style.opacity = T.ease(T.p(t, B[i] + 0.3, 0.4));
        T.$('cc' + (i + 1)).style.opacity = T.ease(T.p(t, TT[i], 0.4));
        T.enter(T.$('k' + (i + 1)), T.p(t, c.FLY + i * 0.25, 0.7), 0, 700);
      }
      // 哪张卡亮，缩小的流程图里对应的节点加「当前」：怎么问 = explore、澄清、拷问；怎么写 = 纪要和「一次写成」那条箭头；写成什么样 = 规格。
      var g1 = span(t, c.B1, c.B2), g2 = span(t, c.B2, c.B3), g3 = span(t, c.B3, c.END);
      ['n1', 'n2', 'n3'].forEach(function (id) { SF.cur(T.$(id), g1, 10); });
      SF.cur(T.$('d1'), g2, 0);
      SF.cur(T.$('hlW'), g2, 0);
      SF.cur(T.$('d4'), g3, 0);
      // 第 30 句念到「规格检查清单和设计图表」：后面的网格先落，前面的清单塔跟着落。
      T.enter(T.$('mGrid'), T.p(t, c.PIC, 0.5), 14);
      T.enter(T.$('mTower'), T.p(t, c.PIC + 0.3, 0.5), 14);
    }
    return { T: T8, show: show, S: S, TX: TX, TY: TY };
  })();

  // ===== 本页：帧脚本 =====
  Stage({
    duration: 31.3,
    init: function () { return T.fonts(T.$('stage').textContent); },
    render: function (t) {
      T.tilt();   // 手写了 data-r、又不做进场动画的元素，先按 data-r 摆好倾角（theme.js 只给自动算角的元素摆）
      S8.show(t);
    }
  });
</script>
