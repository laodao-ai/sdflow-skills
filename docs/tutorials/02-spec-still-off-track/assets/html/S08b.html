<!doctype html>
<!-- S08b · 标题卡 · 系列流程卡（第一级） · script 31–32「放到 sdflow 的六步里看，今天聊的就是前两步：需求明确和规格编写。……下面一件一件聊，先从怎么问开始。」
     2026-10-19 第七轮改稿：全稿句号按 139 句重排
     作者 2026-10-17 定：系列位置单开一页。复制自 channel/design/templates/series-flow.html，只出第一级（data-level="1"）。
     作者 2026-10-18 改：讲的是 sdflow 的六步，不讲排期——
     - 顶部加 sdflow 大卡（参考首期 S50：等宽大字 sdflow；本页是纸底，奶白卡、墨字；比 S50 小，给六步让位）。
     - 不标期号：<html> 上 data-ep="off"，模版关掉「第 N 期」括线。不出进度点（原第 37 句的五个进度点去掉）。
     - 六步整行下移 220（#sf 容器平移，六步本身仍用模版算的 left / top），和大卡一起落在画面中部：大卡 y 230–470，六步 y 550–654。
     - 第 31 句：开口先出大卡，念到「六步」时六步一行依次落下（需求明确、规格编写、规格评审、代码实现、代码评审、收尾归档），
       念到「前两步」时前两步亮「当前」（data-current="1,2"）。
     - 第 32 句：画面不再变化，「当前」描边留到本页结束，接 S14。
     - 纸底（2026-10-20 作者定：只有章节标签页用深色底，系列流程卡不用）。不上蓝 / 琥珀（visual-v4 4.9）。大卡奶白是卡的底色，不表示状态。
     - 动画节点（按录音实测，frame-times.py，2026-10-19）：
       HERO 0.0 第 31 句开口：大卡落下；IN 1.4 念到「六步」（「六」1.44）：六步依次落下；CUR 3.5 念到「前两步」（「前」3.52）：前两步加「当前」；
       第 32 句 7.92–11.28 画面不变。本页 11.7 秒。 -->
<html lang="zh-CN" data-frame-id="S08b" data-level="1" data-done="" data-current="1,2" data-ep="off">
<head>
<meta charset="utf-8">
<title>S08b · 系列流程卡 · sdflow 六步，今天是前两步</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* ===== 模版共用：复制后不改 ===== */
  /* 纸底（2026-10-20 作者定：只有章节标签页用深色底，其余页面都是纸底）。
     「没讲到」= 墨色 65% 不透明度，叠在渲染后的纸底 #8b949e 上约 #3f4246，对比度 3.28:1；CSS 写 --notyet，JS 里同值写 NOTYET。
     透明底的空框（.off）不带硬投影，否则框外会露出一块实心的墨色。 */
  :root { --notyet: rgba(22,22,22,.65); }
  .sf-step.off, .node.off, .act.off, .big3.off { box-shadow: none; }

  /* 第一级：六步一行。 */
  .sf-step { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 16px; }
  .sf-step .big { white-space: nowrap; }
  html[data-level="1"] .sf-step { width: 280px; height: 104px; }
  html[data-level="1"] .sf-step .big { font-size: 44px; }
  html[data-level="1"] .sf-step .num { width: 58px; height: 58px; font-size: 30px; }
  html[data-level="2"] .sf-step { width: 236px; height: 64px; border-width: 4px; padding: 0 12px; gap: 10px; }
  html[data-level="2"] .sf-step .big { font-size: 36px; }
  html[data-level="2"] .sf-step .num { width: 44px; height: 44px; font-size: 26px; border-width: 4px; }
  .sf-step.off { background: transparent; border-color: var(--notyet); color: var(--notyet); }
  .sf-step.off .num { background: transparent; border-color: var(--notyet); color: var(--notyet); }
  /* 期号：括线 + 「第 N 期」。本期那一组用墨，其余用「没讲到」的淡墨。 */
  .sf-ep { position: absolute; text-align: center; white-space: nowrap; color: var(--notyet);
           font-family: var(--display); font-weight: 800; }
  .sf-ep::before { content: ''; display: block; box-sizing: border-box; border: 4px solid currentColor; border-top: none;
                   border-radius: 0 0 8px 8px; height: 14px; margin: 0 10px 4px; }
  html[data-level="1"] .sf-ep { font-size: 34px; }
  html[data-level="2"] .sf-ep { font-size: 26px; line-height: 1.1; }
  html[data-level="2"] .sf-ep::before { height: 8px; border-width: 3px; margin-bottom: 2px; }
  .sf-ep.now { color: var(--ink); }
  html[data-ep="off"] .sf-ep { display: none; }
  #sf-fan { position: absolute; left: 0; top: 0; width: 1920px; height: 200px; }
  #sf-frame { position: absolute; left: 40px; top: 172px; width: 1840px; height: 754px; box-sizing: border-box;
              border: 3px solid rgba(22,22,22,.4); border-radius: 16px; }
  #sf-fan, #sf-frame, .sf-step, .sf-ep { opacity: 0; }
  html[data-level="1"] #sf-fan, html[data-level="1"] #sf-frame, html[data-level="1"] #l2 { display: none; }

  /* 第二级的件。 */
  /* 只铺到字幕带上沿：里面的元素用画布坐标，高度不到 940（渲染前的越界检查会量容器本身）。 */
  #l2 { position: absolute; left: 0; top: 0; width: 1920px; height: 930px; }
  .node { display: flex; align-items: center; justify-content: center; padding: 0 22px; white-space: nowrap;
          font-family: var(--display); font-weight: 800; font-size: 44px; }
  .node.off { background: transparent; border-color: var(--notyet); color: var(--notyet); }
  .node.past { background: var(--cream-dim); }
  .lane { font-family: var(--display); font-weight: 800; }
  .lane.past { background: var(--cream-dim); }
  .arr { position: absolute; height: 6px; border-radius: 3px; background: currentColor; color: var(--ink); }
  .arr::after { content: ''; position: absolute; right: -18px; top: -9px;
                border-left: 20px solid currentColor; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
  .seg { position: absolute; height: 24px; box-sizing: border-box; border: 5px solid var(--notyet); border-top: none;
         border-radius: 0 0 12px 12px; }
  .pdot { position: absolute; width: 58px; height: 58px; box-sizing: border-box; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-family: var(--mono); font-weight: 700; font-size: 26px;
          border: 4px solid var(--notyet); color: var(--notyet); background: transparent; }
  .pdot.done { background: var(--cream-dim); color: var(--ink); border-color: var(--cream-dim); }
  .pdot.now { background: var(--cream); color: var(--ink); border-color: var(--ink); }
  /* ===== 模版共用到此 ===== */

  /* ===== 本页 ===== */
  /* 六步整行下移，给顶上的 sdflow 大卡让位。#sf 是容器（不是会自动倾斜的组件），可以用 transform。 */
  #sf { position: absolute; left: 0; top: 0; transform: translateY(220px); }
  /* sdflow 大卡：照首期 S50 的等宽大字，奶白卡墨字；比 S50（1120×340，220px）小。 */
  .hero { left: 580px; top: 230px; width: 760px; height: 240px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .hero .big { font-family: var(--mono); font-weight: 700; font-size: 150px; line-height: 1; letter-spacing: -3px; }
</style>
</head>
<body>
<div id="stage">
  <!-- ===== 模版共用：第一级，由下面的脚本按 <html> 属性填 ===== -->
  <svg id="sf-fan" viewBox="0 0 1920 200" aria-hidden="true"></svg>
  <div id="sf-frame"></div>
  <div id="sf"></div>

  <!-- 第 31 句开口：sdflow 大卡 -->
  <div class="card hero" id="hero"><div class="big">SDFlow</div></div>
</div>
<script>
  // ===== 模版共用：按 <html> 属性搭第一级。要在 theme.js 之前跑：自动倾角只认加载时已有的元素。 =====
  (function () {
    var STEPS = ['需求明确', '规格编写', '规格评审', '代码实现', '代码评审', '收尾归档'];
    var EP = [2, 2, 3, 4, 5, 6];   // 每步对应第几期（visual-v4 4.9）
    var root = document.documentElement;
    var level = root.getAttribute('data-level') === '2' ? 2 : 1;
    function list(name) {
      return (root.getAttribute(name) || '').split(',').map(function (s) { return Number(s.trim()); }).filter(Boolean);
    }
    var done = list('data-done'), cur = list('data-current');
    // 第一级的几何：level 1 放大居中偏上，level 2 缩到顶部一行。两种都左右对称（中心 x 960）。
    var G = level === 1
      ? { left: 55, top: 330, w: 280, h: 104, gap: 26, epGap: 26 }
      : { left: 187, top: 24, w: 236, h: 64, gap: 26, epGap: 24 };
    var sf = document.getElementById('sf');
    var html = '';
    for (var i = 0; i < 6; i++) {
      var n = i + 1;
      var st = cur.indexOf(n) >= 0 ? 'now' : done.indexOf(n) >= 0 ? 'done' : 'off';
      html += '<div class="card sf-step ' + st + '" id="sf' + n + '" data-shadow="' + (level === 1 ? 10 : 7) + '" style="left:' +
        (G.left + i * (G.w + G.gap)) + 'px;top:' + G.top + 'px"><span class="num">' + n + '</span><span class="big">' + STEPS[i] + '</span></div>';
    }
    // 期号：同一期相邻的几步合成一个括线。
    var a = 0, curL = 9999, curR = 0;
    while (a < 6) {
      var b = a;
      while (b + 1 < 6 && EP[b + 1] === EP[a]) b++;
      var isNow = false;
      for (var k = a; k <= b; k++) if (cur.indexOf(k + 1) >= 0) isNow = true;
      var l = G.left + a * (G.w + G.gap), r = G.left + b * (G.w + G.gap) + G.w;
      if (isNow) { curL = Math.min(curL, l); curR = Math.max(curR, r); }
      html += '<div class="sf-ep' + (isNow ? ' now' : '') + '" id="sfe' + EP[a] + '" style="left:' + l + 'px;width:' + (r - l) +
        'px;top:' + (G.top + G.h + G.epGap) + 'px">第 ' + EP[a] + ' 期</div>';
      a = b + 1;
    }
    sf.innerHTML = html;
    // 第二级：从「当前」那组的期号括线下沿，两条线连到外框上沿两角。
    if (level === 2 && curR > 0) {
      var y0 = G.top + G.h + G.epGap + 32;
      document.getElementById('sf-fan').innerHTML =
        '<path d="M' + (curL + 10) + ' ' + y0 + ' L48 174 M' + (curR - 10) + ' ' + y0 + ' L1872 174" fill="none" ' +
        'stroke="rgba(22,22,22,.4)" stroke-width="3" stroke-linecap="round"/>';
    }
    window.SF_LEVEL = level;
  })();
</script>
<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  // ===== 模版共用：动画小工具 =====
  var SF = (function () {
    var DIM = [160, 157, 151], INK = [22, 22, 22], CREAM = [242, 239, 230], NOTYET = [63, 66, 70];
    // 没讲到 → 讲过：透明底淡墨描边淡墨字 → 奶白底墨描边墨字（同目录页 S05）。里面的 .num 跟着变。
    function lit(el, p) {
      var c = T.mix(NOTYET, INK, p);
      [el].concat(Array.prototype.slice.call(el.querySelectorAll('.num'))).forEach(function (e) {
        e.style.background = 'rgba(242,239,230,' + p + ')';
        e.style.borderColor = c;
        e.style.color = c;
      });
    }
    // 讲过 → 被留下：奶白 → 灰实心。
    function gray(el, p) { el.style.background = T.mix(CREAM, DIM, p); }
    // 「当前」描边。a = 硬投影的不透明度（不传 = 1）：透明底的空框传它的点亮进度，免得没讲到时露出实心投影。
    function cur(el, g, s, a) {
      // s 传 0 = 不要硬投影（进度点）；不传就读 data-shadow，再没有用 10。
      T.current(el, g, s != null ? s : parseFloat(el.getAttribute('data-shadow') || '10'));
      // 浏览器读回来的颜色是 rgb(22, 22, 22) 不是 #161616，两种写法都要认。
      if (a != null) el.style.boxShadow = el.style.boxShadow.replace(/#161616|rgb\(22, 22, 22\)/g, 'rgba(22,22,22,' + a + ')');
    }
    // 横箭头：从 x1 到 x2（箭头尖），竖直中心 y。
    function arrow(el, x1, x2, y) {
      el.style.left = x1 + 'px';
      el.style.width = Math.max(0, x2 - x1 - 18) + 'px';
      el.style.top = (y - 3) + 'px';
    }
    function lerp(a, b, p) { return a + (b - a) * p; }
    // 第一级进场：tIn 起六步依次落下、期号和外框淡入；tCur 起「当前」那几步加黄框。
    function l1(t, tIn, tCur) {
      for (var i = 1; i <= 6; i++) {
        var el = T.$('sf' + i);
        T.enter(el, T.p(t, tIn + (i - 1) * 0.08, 0.5), window.SF_LEVEL === 1 ? 20 : 12);
        if (el.classList.contains('now')) cur(el, T.ease(T.p(t, tCur, 0.4)));
      }
      var e = T.ease(T.p(t, tIn + 0.3, 0.6));
      T.all('.sf-ep').forEach(function (x) { x.style.opacity = e; });
      T.$('sf-fan').style.opacity = e;
      T.$('sf-frame').style.opacity = e;
    }
    return { lit: lit, gray: gray, cur: cur, arrow: arrow, lerp: lerp, l1: l1 };
  })();
  // ===== 模版共用到此 =====

  // ===== 本页：帧脚本 =====
  // 时刻（秒，本页起算；按录音实测，frame-times.py，2026-10-19）。对应的句子见文件头注释。
  var HERO = 0.0, IN = 1.4, CUR = 3.5;
  Stage({
    duration: 11.7,
    init: function () { return T.fonts(T.$('stage').textContent); },
    render: function (t) {
      T.tilt();   // 手写了 data-r、又不做进场动画的元素，先按 data-r 摆好倾角（theme.js 只给自动算角的元素摆）
      T.enter(T.$('hero'), T.p(t, HERO, 0.6), 24);
      SF.l1(t, IN, CUR);
    }
  });
</script>
</body>
</html>
