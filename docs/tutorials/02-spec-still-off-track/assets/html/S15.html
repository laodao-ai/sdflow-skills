<script>
  // 节点时刻（秒，画面从 0 算）。按录音实测（frame-times.py，2026-10-19）。
  var CUES = {
    head:  0.0,   // 第 33 句 一开口：顶行
    shell: 0.4,   // 第 33 句：两栏空壳（只有标题，淡）
    colL:  13.3,  // 第 34 句 「问题的边界」：左栏点亮
    colR:  14.4,  // 第 34 句 「方案的方向」：右栏点亮
    curLFrom: 16.3, curLTo: 21.3,  // 第 35 句 左栏当前 → 第 36 句开口换右栏
    curRTo: 26.5,                  // 右栏当前到第 37 句开口
    l1: 17.2,     // 第 35 句 「目标一句话说得清楚」
    l2: 19.0,     // 第 35 句 「范围也清晰了」
    l3: 22.1,     // 第 36 句 「只剩一个方案」
    l4: 23.3,     // 第 36 句 「或者 AI 给你推荐方案」
    rule: 26.4,   // 第 37 句 开口：分隔线
    r3: 26.5,     // 第 37 句 「剩下的都是细节」
    r4: 34.0,     // 第 38 句 「聊到哪儿算够」
    quote: 39.0,  // 第 39 句 「只加了一条硬规定」
    r5: 43.2,     // 第 39 句 「你说开搞」
    you: 43.3     // 第 39 句 「你」加黄框（「你」实测 43.28）
  };
  var SHELL = 0.35;  // 空壳透明度：讲到之前先占位，讲到时点亮到 1

  Stage({
    duration: 46.5,
    init: function () { return T.fonts('探索想清要不要做什么不落文档问题边界方案方向实录目标一句话说得清范围清晰只剩一个或给推荐'); },
    render: function (t) {
      T.enter(T.$('head'), T.p(t, CUES.head, 0.4), -14);

      // 两栏：开头就以空壳淡入，念到哪栏哪栏点亮；内容随第 35、36 句逐行出来，念到哪栏哪栏当前。
      T.enter(T.$('cl'), T.p(t, CUES.shell, 0.5), 18);
      T.enter(T.$('cr'), T.p(t, CUES.shell + 0.15, 0.5), 18);
      T.$('cl').style.opacity = parseFloat(T.$('cl').style.opacity) * (SHELL + (1 - SHELL) * T.ease(T.p(t, CUES.colL, 0.4)));
      T.$('cr').style.opacity = parseFloat(T.$('cr').style.opacity) * (SHELL + (1 - SHELL) * T.ease(T.p(t, CUES.colR, 0.4)));
      ['l1', 'l2', 'l3', 'l4'].forEach(function (id) {
        var e = T.ease(T.p(t, CUES[id], 0.4));
        T.$(id).style.opacity = e;
        T.$(id).style.transform = 'translateY(' + ((1 - e) * 10) + 'px)';
      });
      var gL = T.ease(T.p(t, CUES.curLFrom, 0.4)) * (1 - T.ease(T.p(t, CUES.curLTo, 0.4)));
      var gR = T.ease(T.p(t, CUES.curLTo, 0.4)) * (1 - T.ease(T.p(t, CUES.curRTo, 0.4)));
      T.current(T.$('cl'), gL, 10);
      T.current(T.$('cr'), gR, 10);

      // 分隔线与下面三行
      T.wipe(T.$('rule'), T.p(t, CUES.rule, 0.6), 'x');
      T.enter(T.$('r3'), T.p(t, CUES.r3, 0.5), 16);
      T.enter(T.$('r4'), T.p(t, CUES.r4, 0.5), 16);
      T.enter(T.$('quote'), T.p(t, CUES.quote, 0.5), -16);
      T.enter(T.$('r5'), T.p(t, CUES.r5, 0.5), 16);

      // 「你」加黄框：只给这一个字
      var g = T.ease(T.p(t, CUES.you, 0.4));
      T.$('you').style.outline = '6px solid rgba(245,207,74,' + g + ')';
      T.$('you').style.outlineOffset = '4px';
      T.$('you').style.boxShadow = '0 0 0 4px rgba(138,147,157,' + g + '), 0 0 0 10px rgba(22,22,22,' + g + '), 0 0 40px rgba(245,207,74,' + (0.5 * g) + ')';
    }
  });
</script>
