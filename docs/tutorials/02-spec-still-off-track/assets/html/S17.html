<html lang="zh-CN" data-frame-id="S17">
<head>
<meta charset="utf-8">
<title>S17 · 拷问三问卡</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* 顶行：样式同 S15 #head。外层 #headw 管放大和位移，贴纸自己只管倾角 */
  #headw { left: 60px; top: 30px; transform-origin: 0 0; }
  #head { left: 0; top: 0; height: 96px; padding: 0 44px; display: flex; align-items: center; }

  #head .a { font-family: var(--display); font-weight: 800; font-size: 56px; color: var(--ink); white-space: nowrap; }

  /* 顶行右边：引文窗口（基于 .cmd，缩小） */
  #quote { left: 1200px; top: 56px; width: 660px; padding: 0; overflow: visible; white-space: normal; }
  #quote .tab { left: auto; right: 22px; top: -48px; font-size: 34px; padding: 2px 20px; }
  #quote .bar { height: 40px; display: flex; align-items: center; padding: 0 22px; box-sizing: border-box;
                background: var(--charcoal); border-bottom: 4px solid var(--ink); border-radius: 7px 7px 0 0;
                font-size: 26px; line-height: 1; color: var(--cream); white-space: nowrap; }
  #quote .body { padding: 12px 22px 14px; display: flex; gap: 26px; font-size: 34px; line-height: 1.4; }
  #quote .ln { flex: none; color: var(--unlit); }
  #quote .q { flex: 1; white-space: nowrap; color: var(--cream); }

  /* 三条横带：左边行标题，竖线右边内容区。内容用横带内的坐标定位。 */
  .band { left: 60px; width: 1800px; height: 170px; padding: 0; }
  #band1 { top: 224px; }
  #band2 { top: 422px; }
  #band3 { top: 620px; }
  .band .lab { position: absolute; left: 24px; top: 0; height: 160px; display: flex; align-items: center; gap: 16px; }
  .band .lab .num { width: 58px; height: 58px; font-size: 34px; }
  .band .lab .t { font-family: var(--display); font-weight: 800; font-size: 44px; color: var(--ink); white-space: nowrap; }
  .band .div { position: absolute; left: 440px; top: 18px; width: 5px; height: 124px; background: var(--ink); opacity: .75; border-radius: 3px; }

  /* 问谁：三格（横带内坐标） */
  .cell { top: 7px; height: 146px; padding: 8px 18px; border-width: 4px; box-shadow: 6px 6px 0 var(--ink); }
  .cell .h { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1.1; color: var(--ink); white-space: nowrap; }
  .cell .b { font-weight: 600; font-size: 34px; line-height: 1.25; color: var(--ink); white-space: nowrap; }
  .cell .b i { font-style: normal; font-family: var(--mono); font-weight: 700; margin-right: 8px; }
  #c1 { left: 465px; width: 260px; }
  #c2 { left: 743px; width: 535px; }
  #c3 { left: 1296px; width: 460px; padding: 8px 14px; }
  /* 第 56 句飞进第三格的缩略卡：S16 探索实录里那一句。放在第三格「→ 问你」右边，28px，留在格内 */
  #thumb { left: 1440px; top: 100px; padding: 0 12px; border-width: 4px; box-shadow: 5px 5px 0 var(--ink);
           font-weight: 600; font-size: 28px; line-height: 1.15; white-space: nowrap; }

  /* 先问什么（横带内坐标） */
  #k2 { left: 465px; top: 44px; font-family: var(--display); font-weight: 800; font-size: 44px; padding: 8px 24px; }
  #k2 .a { font-family: var(--mono); font-weight: 700; margin: 0 12px; }
  .plan { top: 12px; width: 210px; text-align: center; padding: 4px 0; font-size: 34px; border-width: 4px; box-shadow: 5px 5px 0 var(--ink); }
  #p1 { left: 960px; }
  #p2 { left: 1200px; }
  #p3 { left: 1440px; }
  #base { left: 930px; top: 96px; width: 750px; height: 58px; padding: 0; display: flex; align-items: center; justify-content: center;
          font-family: var(--display); font-weight: 800; font-size: 40px; border-width: 4px; box-shadow: 6px 6px 0 var(--ink); }

  /* 问到什么时候停（横带内坐标） */
  #stop { left: 465px; top: 46px; background: var(--cream); }
  #strike { left: 477px; top: 0; height: 5px; background: var(--ink); border-radius: 3px; }
  #need { left: 715px; top: 58px; font-weight: 600; font-size: 34px; color: var(--ink); white-space: nowrap; }

  #e1 { left: 1070px; }
  #e2 { left: 1305px; }

  /* 最下一行 */
  #last { left: 60px; top: 806px; padding: 10px 24px; }
  #last .k { font-weight: 600; font-size: 42px; color: var(--ink); }
  #last .a { font-family: var(--mono); font-weight: 700; font-size: 38px; color: var(--ink); margin: 0 14px; }

<body>
<div id="stage">
  <div class="abs" id="headw"><div class="card" id="head"><span class="a">拷问：怎么问到点上？</span></div></div>

  <div class="cmd" id="quote" data-r="0">
    <div class="tab ink" data-r="-2" style="transform: rotate(-2deg)">实录</div>
    <div class="bar">sdflow-spec/SKILL.md:62</div>
    <div class="body"><span class="ln">62</span><span class="q">人做的是拍板，不是替你做调研。</span></div>
  </div>

  <!-- 1 问谁 -->
  <div class="card band" id="band1" data-r="-0.3">
    <div class="lab"><span class="num">1</span><span class="t">问谁</span></div>
    <div class="div"></div>
    <div class="card cell" id="c1" data-r="1"><div class="h">查得到的</div><div class="b" id="c1b"><i>→</i>AI 自己查</div></div>
    <div class="card cell" id="c2" data-r="-1"><div class="h">有几个方案</div><div class="b" id="c2b"><i>→</i>AI 调研后带推荐和三方面后果<br>（系统 · 用户 · 开发），你拍板</div></div>
    <div class="card cell" id="c3" data-r="1"><div class="h">只有你知道的</div><div class="b" id="c3b">需求 · 约束 · 偏好<br><i>→</i>问你</div></div>
    <div class="card dark" id="thumb" data-r="-2">这个只有你知道</div>
  </div>

  <!-- 2 先问什么 -->
  <div class="card band" id="band2" data-r="0.3">
    <div class="lab"><span class="num">2</span><span class="t">先问什么</span></div>
    <div class="div"></div>
    <div class="chip" id="k2">承重约束<span class="a">→</span>先攻</div>
    <div class="card" id="base" data-r="0">前提</div>
    <div class="chip plan" id="p1" data-r="0">方案 A</div>
    <div class="chip plan" id="p2" data-r="0">方案 B</div>
    <div class="chip plan" id="p3" data-r="0">方案 C</div>
  </div>

  <!-- 3 问到什么时候停 -->
  <div class="card band" id="band3" data-r="-0.3">
    <div class="lab"><span class="num">3</span><span class="t">问到什么时候停</span></div>
    <div class="div"></div>
    <div class="chip" id="stop">问了 N 轮</div>
    <div class="abs" id="strike"></div>
    <div class="abs" id="need">每条承重约束有证据：</div>
    <div class="chip ev" id="e1">文件行号</div>
    <div class="chip ev" id="e2">命令输出</div>
    <div class="chip ev" id="e3">你的确认</div>
  </div>

  <div class="chip" id="last"><span class="k">AI 找问题、给推荐、摆后果</span><span class="a">→</span><span class="k"><span class="you" id="you">你来决策</span></span></div>
</div>
<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  // 节点时刻（秒，画面从 0 算）。按录音实测（frame-times.py，2026-10-19）。
  var CUES = {
    head: 0,                      // 第 51 句 一开口：顶行贴纸在屏幕正中放大出现
    headMove: 1.4,                // 第 51 句末：缩小移回左上，用 0.6 秒
    shell: 3.83,                  // 第 52 句 开口后：三条横带空壳（每条晚 0.12 秒）
    lit: [5.99, 7.11, 8.71],         // 第 52 句 「问谁」「先问什么」「问到什么时候停」：横带点亮
    cur1: 10.95, cur2: 42.39, cur3: 54.63, curEnd: 70.07,  // 第 53 / 57 / 58 句开口换当前行，第 60 句开口描边淡出
    c1: 13.19,                    // 第 53 句 「代码里查得到的事实」
    c2: 18.63,                    // 第 54 句 「有几个方案可选的」
    quote: 27.51,                 // 第 54 句 「你来拍板」：引文窗口
    c3: 29.51,                    // 第 55 句 「只有你自己知道的」
    thumbFrom: 37.35, thumbTo: 38.35,  // 第 56 句 「前面探索里那句」：缩略卡飞进第三格
    k2: 44.79,                    // 第 57 句 「先攻承重约束」
    base: 47.67,                  // 第 57 句 「好几个方案都靠它支撑着的那个前提」
    plans: [48.27, 48.67, 49.07],
    shake: 50.95,                 // 第 57 句 「它一倒」：前提一晃，三张一起晃
    stop: 57.51, strike: 58.23,     // 第 58 句 「不看问了几轮」→ 划掉
    need: 58.87,                  // 第 58 句 「看每条承重约束有没有证据」
    ev: [63.43, 65.91, 67.75],       // 第 59 句 「代码的文件和行号」「命令的输出」「你本人的确认」
    last: 73.83,                  // 第 60 句 「AI 负责把问题找出来……」
    you: 80.39                    // 第 60 句 「决策还是你来做」
  };
  var SHELL = 0.35;  // 空壳透明度：讲到之前先占位，讲到时点亮到 1
  var HEAD_SCALE = 1.5;          // 顶行贴纸开头的放大倍数
  var HEAD_CENTER = [960, 470];  // 放大时贴纸中心在画布上的位置

  function gate(t, from, to) { return T.ease(T.p(t, from, 0.4)) * (1 - T.ease(T.p(t, to, 0.4))); }
  function mulOpacity(el, k) { el.style.opacity = parseFloat(el.style.opacity) * k; }
  // 阻尼摇晃：t0 起幅度 amp 度，约 2.5 秒衰减回 0。
  function wobble(t, t0, amp, phase) {
    if (t < t0) return 0;
    var d = t - t0;
    return amp * Math.sin(13 * d + phase) * Math.exp(-1.8 * d);
  }

  Stage({
    duration: 82.9,
    init: function () { return T.fonts('拷问怎么到点上实录人做的是拍板不替你调研谁查得自己有几个方案后带推荐和三面果系统用户开发只知道需求约束偏好这先什承重攻前提时候停了轮每条证据文件行号命令输出确认找题给摆来决策'); },
    render: function (t) {
      // 第 51 句：顶行贴纸先在正中放大，句末缩小移回左上
      T.enter(T.$('head'), T.p(t, CUES.head, 0.4), -14);
      var hw = T.$('headw'), hd = T.$('head');
      var mv = T.ease(T.p(t, CUES.headMove, 0.6));
      var fx = HEAD_CENTER[0] - HEAD_SCALE * hd.offsetWidth / 2 - 60, fy = HEAD_CENTER[1] - HEAD_SCALE * hd.offsetHeight / 2 - 30;
      hw.style.transform = 'translate(' + (fx * (1 - mv)) + 'px,' + (fy * (1 - mv)) + 'px) scale(' + (HEAD_SCALE + (1 - HEAD_SCALE) * mv) + ')';
      T.enter(T.$('quote'), T.p(t, CUES.quote, 0.5), -16);

      // 三条横带：第 52 句开口后空壳淡入，念到三个词时依次点亮；当前行黄描边
      var cur = [gate(t, CUES.cur1, CUES.cur2), gate(t, CUES.cur2, CUES.cur3), gate(t, CUES.cur3, CUES.curEnd)];
      for (var i = 0; i < 3; i++) {
        var band = T.$('band' + (i + 1));
        T.enter(band, T.p(t, CUES.shell + i * 0.12, 0.5), 16);
        mulOpacity(band, SHELL + (1 - SHELL) * T.ease(T.p(t, CUES.lit[i], 0.4)));
        T.current(band, cur[i], 10);
      }

      // 问谁：三格先是空壳（只有格标题，淡），念到哪格哪格点亮
      ['c1', 'c2', 'c3'].forEach(function (id) {
        var on = T.ease(T.p(t, CUES[id], 0.45));
        var el = T.$(id);
        el.style.opacity = SHELL + (1 - SHELL) * on;
        el.style.transform = 'translateY(' + ((1 - on) * 0) + 'px) rotate(' + el.getAttribute('data-r') + 'deg)';
        var b = T.$(id + 'b');
        b.style.opacity = on;
        b.style.transform = 'translateY(' + ((1 - on) * 10) + 'px)';
      });

      // 第 56 句：缩略卡从左上飞进第三格，留在格里
      var f = T.ease(T.p(t, CUES.thumbFrom, CUES.thumbTo - CUES.thumbFrom));
      var th = T.$('thumb');
      th.style.opacity = T.ease(T.p(t, CUES.thumbFrom, 0.2));
      th.style.transform = 'translate(' + ((1 - f) * -760) + 'px,' + ((1 - f) * -150) + 'px) rotate(' + (-2 + (1 - f) * -8) + 'deg) scale(' + (1 + (1 - f) * 0.3) + ')';

      // 先问什么：「承重约束 → 先攻」，前提撑着三个方案；念到「它一倒」一起晃，晃完回原位
      T.enter(T.$('k2'), T.p(t, CUES.k2, 0.45), 14);
      T.enter(T.$('base'), T.p(t, CUES.base, 0.45), 14);
      ['p1', 'p2', 'p3'].forEach(function (id, j) { T.enter(T.$(id), T.p(t, CUES.plans[j], 0.4), -20); });
      if (t >= CUES.shake) {
        var w = wobble(t, CUES.shake, 3, 0);
        T.$('base').style.transform = 'rotate(' + w + 'deg)';
        var off = [-1, 0, 1];
        ['p1', 'p2', 'p3'].forEach(function (id, j) {
          var wj = wobble(t, CUES.shake + 0.05 * j, 7, 0.8 * j);
          // 前提转动时，上面的方案跟着上下错开，再各自晃
          var dy = Math.sin(w * Math.PI / 180) * off[j] * 240;
          T.$(id).style.transform = 'translate(0,' + dy.toFixed(1) + 'px) rotate(' + (w + wj).toFixed(2) + 'deg)';
        });
      }

      // 问到什么时候停：「问了 N 轮」划掉，右边三种证据
      T.enter(T.$('stop'), T.p(t, CUES.stop, 0.4), 14);
      var stopEl = T.$('stop');
      stopEl.style.background = T.mix([242, 239, 230], [160, 157, 151], T.ease(T.p(t, CUES.strike, 0.4)));
      var sk = T.$('strike');
      sk.style.left = (465 + 12) + 'px';
      sk.style.width = (stopEl.offsetWidth - 24) + 'px';
      sk.style.top = (46 + stopEl.offsetHeight / 2 - 3) + 'px';
      T.strike(sk, T.p(t, CUES.strike, 0.4));
      sk.style.opacity = T.p(t, CUES.stop, 0.2);
      var nd = T.ease(T.p(t, CUES.need, 0.4));
      T.$('need').style.opacity = nd;
      T.$('need').style.transform = 'translateY(' + ((1 - nd) * 10) + 'px)';
      ['e1', 'e2', 'e3'].forEach(function (id, j) { T.enter(T.$(id), T.p(t, CUES.ev[j], 0.4), 14); });

      // 最下一行
      T.enter(T.$('last'), T.p(t, CUES.last, 0.5), 16);
      var g = T.ease(T.p(t, CUES.you, 0.4));
      var y = T.$('you');
      y.style.outline = '6px solid rgba(245,207,74,' + g + ')';
      y.style.outlineOffset = '4px';
      y.style.boxShadow = '0 0 0 4px rgba(138,147,157,' + g + '), 0 0 0 10px rgba(22,22,22,' + g + '), 0 0 40px rgba(245,207,74,' + (0.5 * g) + ')';
    }
  });
</script>
</body>
</html>
