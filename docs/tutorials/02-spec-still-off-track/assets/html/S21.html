<script>
  // 节点时刻（秒）。按录音实测（frame-times.py，2026-10-19）。注释写的是对应全稿第几句。
  var CUE = {

    headsEnd: 25.4,            // 78 句念完，黄框撤掉

    fwd: 35.8,                 // 81 句「再从纪要一次写成四个文档」
    docs: [37.4, 38.3, 39.2, 40.1],   // 81 句「一个一个写」，每个文档出现；校验勾晚 0.7 秒
    back: 43.7,                // 82 句「它还要拿纪要逐条对一遍」，四个文档回连纪要
    cmpTag: 44.1,              // 82 句
    cmp: [46.8, 48.5, 50.4],   // 82 句「决定有没有漏」「约束有没有写反」「有没有加了纪要里没有的东西」
    fp: 53.3,                  // 83 句「纪要定稿时还会算一个内容指纹」
    fpRows: [54.9, 57.9],      // 83 句「生成规格文档前对一下」两个值依次出现
    fpStop: 59.2               // 83 句「防止纪要被悄悄改掉」，不一样，停下
  };

  var HEAD_SCALE = 1.7;          // 标题贴纸开头的放大倍数
  var HEAD_CENTER = [960, 500];  // 放大时贴纸中心在画布上的位置
  var SHELL = 0.3;  // 空壳透明度：讲到之前先占位，讲到时点亮到 1
  // 空壳：shell 时刻起淡入到 SHELL，lit 时刻点亮到 1。卡片用 enter 进场，再乘上点亮系数。
  function ghost(el, t, i, lit, dy) {
    T.enter(el, T.p(t, CUE.shell + i * 0.06, 0.5), dy);
    el.style.opacity = parseFloat(el.style.opacity) * (SHELL + (1 - SHELL) * T.ease(T.p(t, lit, 0.45)));
  }
  function ghostLine(el, t, i, lit) {
    el.setAttribute('opacity', T.ease(T.p(t, CUE.shell + i * 0.06, 0.5)) * (SHELL + (1 - SHELL) * T.ease(T.p(t, lit, 0.3))));
  }

  // 代码窗口里的「当前」行：同 T.current 的黄描边，去掉为浅色底准备的灰环，深色窗口里只留黄框 + 外发光。
  function lineOn(el, g) {
    if (g <= 0.01) { el.style.outline = 'none'; el.style.boxShadow = 'none'; return; }
    T.current(el, g, 0.01);
    el.style.outlineOffset = '5px';
    el.style.boxShadow = '0 0 40px rgba(245,207,74,' + (0.5 * g) + ')';
  }

  Stage({
    duration: 62,
    init: function () { return T.fonts('实录示例项目先落纪要再成文拷问起手建分支目录草稿每拍一条当场写入拍板决策含砍掉的候选承重约束证据锚接受的边角断了只丢最后一格校验拿逐条对漏没反多指纹里写的现在重算不一样停下'); },
    render: function (t) {
      // 标题贴纸：容器先放大到正中，停一会儿，再缩小移回原位；贴纸自己的进场（淡入、倾角）照旧
      T.enter(T.$('head'), T.p(t, CUE.head, 0.45), -14);
      var hw = T.$('headw'), hd = T.$('head');
      var mv = T.ease(T.p(t, CUE.headHold, CUE.headMove));
      var fx = HEAD_CENTER[0] - HEAD_SCALE * hd.offsetWidth / 2 - 90, fy = HEAD_CENTER[1] - HEAD_SCALE * hd.offsetHeight / 2 - 86;
      hw.style.transform = 'translate(' + (fx * (1 - mv)) + 'px,' + (fy * (1 - mv)) + 'px) scale(' + (HEAD_SCALE + (1 - HEAD_SCALE) * mv) + ')';
      T.enter(T.$('real'), T.p(t, CUE.real, 0.45), -14);

      // 拷问时三步与纪要窗口：开头是空壳，讲到时点亮
      ghost(T.$('pA'), t, 0, CUE.pA, 16);
      ghostLine(T.$('wAB'), t, 1, CUE.pB - 0.3);
      ghost(T.$('pB'), t, 2, CUE.pB, 16);
      ghostLine(T.$('wBC'), t, 3, CUE.pC - 0.3);
      ghost(T.$('pC'), t, 4, CUE.pC, 16);
      ghostLine(T.$('wCA'), t, 5, CUE.wCA);
      ghost(T.$('memo'), t, 5, CUE.memo, 20);
      T.$('stamp').style.opacity = T.ease(T.p(t, CUE.stamp, 0.3));

      // 79 句：一格一格写入
      var cutP = T.ease(T.p(t, CUE.cut, 0.4));
      for (var i = 0; i < 6; i++) {
        var bar = T.$('b' + i);
        var on = T.ease(T.p(t, CUE.bars + i * 0.4, 0.3));
        // 最后一格在 80 句断掉：变灰变虚线
        bar.style.opacity = i === 5 ? on * (1 - 0.65 * cutP) : on;
      }
      var last = T.$('b5');
      last.style.background = cutP > 0.01 ? 'transparent' : 'rgba(140,200,245,.6)';
      last.style.border = cutP > 0.01 ? '3px dashed rgba(140,200,245,.9)' : '0';
      last.style.boxSizing = 'border-box';
      T.$('wCut').setAttribute('opacity', cutP * (1 - T.ease(T.p(t, CUE.cutGone, 0.4))));
      T.enter(T.$('cut'), T.p(t, CUE.cut + 0.2, 0.45), 10);
      T.$('cut').style.opacity = T.ease(T.p(t, CUE.cut + 0.2, 0.45)) * (1 - T.ease(T.p(t, CUE.cutGone, 0.4)));

      // 78 句：三个小节标题依次点亮（行号同时出现，白话小卡晚 0.25 秒贴上）
      for (var h = 0; h < 3; h++) {
        var el = T.$('h' + h);
        var hp = T.ease(T.p(t, CUE.heads[h], 0.35));
        el.style.opacity = hp;
        T.$('n' + h).style.opacity = hp;
        if (h < 2) T.enter(T.$('s' + h), T.p(t, CUE.heads[h] + 0.25, 0.4), -8);
        var end = h < 2 ? CUE.heads[h + 1] : CUE.headsEnd;
        var gg = T.ease(T.p(t, CUE.heads[h], 0.3)) * (1 - T.ease(T.p(t, end, 0.3)));
        lineOn(el, gg);
        T.$('slot' + h).style.opacity = 1 - hp;
      }

      // 81 句：纪要 → 四个文档，每个带校验勾
      ghostLine(T.$('wFwd'), t, 6, CUE.fwd);
      for (var d = 0; d < 4; d++) {
        ghost(T.$('d' + d), t, 7 + d, CUE.docs[d], 18);
        T.$('d' + d).querySelector('.chk').style.opacity = T.ease(T.p(t, CUE.docs[d] + 0.7, 0.3));
      }

      // 82 句：回连纪要，逐条打勾
      T.$('wBack').setAttribute('opacity', T.ease(T.p(t, CUE.back, 0.4)));
      T.enter(T.$('cmpTag'), T.p(t, CUE.cmpTag, 0.45), 10);
      for (var c = 0; c < 3; c++) {
        T.enter(T.$('c' + c), T.p(t, CUE.cmp[c], 0.4), 12);
        T.$('c' + c).querySelector('.tick').style.opacity = T.ease(T.p(t, CUE.cmp[c] + 0.4, 0.25));
      }

      // 83 句：指纹小卡
      T.enter(T.$('fp'), T.p(t, CUE.fp, 0.5), 18);
      for (var r = 0; r < 2; r++) T.$('fr' + r).style.opacity = T.ease(T.p(t, CUE.fpRows[r], 0.35));
      T.$('fpStop').style.opacity = T.ease(T.p(t, CUE.fpStop, 0.3));
    }
  });
</script>
</body>
</html>
