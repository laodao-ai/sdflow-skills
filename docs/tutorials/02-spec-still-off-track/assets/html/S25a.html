     分别写作 上下文图 / 容器图 / 组件图 / 模块关系图 / 时序图 / 决策图 / 任务依赖图；竞态时序图 = 第三节「并发 / 共享可变状态 → 序列图（竞态交互时序）」）。
     - 每张缩略图只画这种图长什么样（几个框几条线），不写场景。不是示例项目的产物，右上角标「示意」。
     - 0 秒：十三张暗着排好（三行：结构 5 / 行为 5 / 验证与决策 3，左边是组名）。
     - 101 句：念到「结构」时结构组亮起，组名当前。

<script>
  // 句子开口时刻，按录音实测（frame-times.py，2026-10-19）。下标 0 = 本页第 1 句 = 全稿 101 句。
  var CUE = [
    0.0,   // 101 图也按需求来画：结构上画上下文、容器和组件图。
    6.56,  // 102 行为上画状态机、数据流、决策和时序图。
    11.52, // 103 还有测试覆盖图、对比表和任务依赖图。
    16.8,  // 104 画图有两个好处：一是方便你看懂方案……
    24.96, // 105 二是逼着 AI 把流程一步步走一遍……
    32.96, // 106 这些要求我写进了 OpenSpec 的配置里……
    40.72  // 107 能在写的时候防住的，就别留到评审再查。（44.08 念完）
  ];
  function S(n) { return CUE[n - 101]; }

  // 句内节点，取该词第一个字的实测开始时间（可提前至多 0.2 秒）
  var AT_G = [2.3, 7.5, 12.0];   // 101「结构」（结 2.40）、102「状态机」（状 7.52）、103「测试覆盖图」（测 12.08）
  var GAP  = [0.3, 0.25, 0.35];  // 组内逐张亮起的间隔
  var AT_BEN1 = 20.1;            // 104 句念到「看懂方案」（看 20.16）
  var AT_BEN2 = 27.6;            // 105 句念到「走一遍」（走 27.68）
  var AT_CFG  = 35.0;            // 106 句念到「配置」（配 35.04）

  var CREAM = [242, 239, 230], DIM = [160, 157, 151];
  // 代码窗口里的「当前」行：同 T.current 的黄描边，去掉为浅色底准备的灰环，深色窗口里只留黄框 + 外发光。
  function lineOn(el, g) {
    T.current(el, g, 0.01);
    el.style.outlineOffset = '4px';
    el.style.boxShadow = '0 0 40px rgba(245,207,74,' + (0.5 * g) + ')';
  }
  function on(t, a, b) { return T.ease(T.p(t, a, 0.4)) * (1 - T.ease(T.p(t, b, 0.4))); }

  Stage({
    duration: 45.2,
    init: function () { return T.fonts('示意看懂方案逼走一遍流程、露出盲点结构行为验证与决策上下文图容器组件模块关系部署状态机数据流时序竞态测试覆盖对比表任务依赖示例项目设计画规则（哪些何时ASCII优先）·'); },
    render: function (t) {
      T.enter(document.querySelector('.mock'), T.p(t, 0.2, 0.4), -10);

      // 网格：0 秒暗着排好，留到页尾（2026-10-19 第七轮：原 107 句开口后淡出，屏上空约 5 秒）
      var fade = 1;
      var NEXT = [S(102), S(103), S(104)];
      for (var g = 0; g < 3; g++) {
        var grp = T.$('g' + (g + 1));
        T.enter(grp, T.p(t, 0.1 + g * 0.1, 0.4), 12);
        grp.style.opacity = T.ease(T.p(t, 0.1 + g * 0.1, 0.4)) * fade;
        T.current(grp, on(t, AT_G[g], NEXT[g]), 8);

        var tiles = T.all('.t' + (g + 1));
        for (var i = 0; i < tiles.length; i++) {
          var el = tiles[i];
          var pin = T.p(t, 0.2 + (g * 5 + i) * 0.04, 0.4);
          T.enter(el, pin, 12);
          el.style.opacity = T.ease(pin) * fade;
          var lit = T.ease(T.p(t, AT_G[g] + i * GAP[g], 0.5));
          el.style.background = T.mix(DIM, CREAM, lit);
          el.querySelector('svg').style.opacity = 0.35 + 0.65 * lit;
          el.querySelector('.nm').style.opacity = 0.45 + 0.55 * lit;
        }
      }

      // 104、105 句：两个好处
      T.enter(T.$('ben1'), T.p(t, AT_BEN1, 0.45), -14);
      T.current(T.$('ben1'), on(t, AT_BEN1, S(105)), 7);
      T.enter(T.$('ben2'), T.p(t, AT_BEN2, 0.45), -14);
      T.current(T.$('ben2'), on(t, AT_BEN2, S(106)), 7);

      // 106 句：底部配置行 + 出处
      var cfg = T.$('cfg');
      var pc = T.ease(T.p(t, AT_CFG, 0.5));
      cfg.style.opacity = pc;
      cfg.style.transform = 'translateY(' + ((1 - pc) * -12) + 'px)';
      lineOn(T.$('cfgLine'), on(t, AT_CFG, S(107)));

    }
  });
</script>
