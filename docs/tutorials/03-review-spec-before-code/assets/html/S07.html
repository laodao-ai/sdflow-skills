<!-- S07 · 角色图 · script 20–22「先说第一个问题：让 AI 审，怎么审？……每个 agent 起来都是干净的，只看文档和代码，没有写的时候那些想法。」
     示意，原理图，不标「实录」（右上角「示意」）。人、Agent、仓库文件、运行环境四个固定角色（visual-v4 第五节），运行环境不点亮（.unlit）；
     图形放在炭灰方块上，名字贴纸挂在方块下沿外 18px。只用几何图形，不画人物。
     左：写规格的那个会话框，整张灰（灰 = 被留下，visual-v4 第二节）。
     右：仓库文件在上，四个独立的 Agent 并排在下，每个头上一张「空白上下文」小贴纸；Agent 只连到仓库文件（文档和代码），不连左边的会话。
     - 第 20 句：人、仓库文件、运行环境（不点亮）从开头就在，不留空屏。
     - 第 21 句：念到「不在写规格的那个会话里审」时左边灰色会话框落下（当前，黄描边）；念到「派独立的 agent」时第一个 Agent 落下，其余三个跟着，各带「空白上下文」。
     - 第 22 句：念到「只看文档和代码」时四条线从各 Agent 连到仓库文件；左边会话框不连线（不动）。
     - 原第 23 句「为什么一定要换，后面再说」和角上问号贴纸作者 10-23 删去。
     - 仓库文件旁两张小贴纸：「规格」蓝（规格一侧）、「代码」琥珀（执行一侧）；红 / 绿 / 黄实底不用（黄只作「当前」描边）。
     - 内容都在 y 920 以上，避开字幕带（名字贴纸挂在方块下沿外 18px；落差只有 12）。
     配色（2026-10-23）：人、Agent、仓库文件、运行环境保持炭灰中性；写规格的会话整张灰（被留下）；仓库文件旁「规格」蓝、「代码」琥珀照旧；
       不再补色：本页的重点是「换个干净的上下文」，加色只会分散。
     口播时刻按录音实测（frame-times.py，2026-10-25），节点取词首字实测开始时间减 0.2 秒。第 20 句 0.0，第 21 句 6.00，第 22 句 13.04，全页 19.84。 -->

<div id="stage">

  <!-- 人、运行环境（不点亮） -->

<script>
  // 口播节点（秒，画面内，按录音实测：词首字开始时间减 0.2 秒）。
  var AT = {
    base: 0.0,       // 第 20 句开口：人、仓库文件、运行环境落下
    sess: 7.96,      // 第 21 句「不在写规格的那个会话里审」：灰色会话框落下，当前
    sessOff: 10.08,   // 当前描边淡出
    a1: 10.28,        // 「派独立的 agent」：第一个 Agent
    a234: 11.08,     // 其余三个，各带空白上下文
    wires: 15.32     // 第 22 句「只看文档和代码」：四条线连到仓库文件
  };

  Stage({
    duration: 19.84,
    init: function () { return T.fonts('示意写规格的会话时候想法还在里面人仓库文件运行环境代码空白上下文'); },
    render: function (t) {

      // 第 20 句：人、仓库文件、运行环境（不点亮）
      T.enter(T.$('human'), T.p(t, AT.base, 0.5), 20);
      T.enter(T.$('repo'), T.p(t, AT.base + 0.2, 0.5), 20);
      T.enter(T.$('runtime'), T.p(t, AT.base + 0.4, 0.5), 12);
      T.enter(T.$('rdoc'), T.p(t, AT.base + 0.7, 0.4), -10);
      T.enter(T.$('rcode'), T.p(t, AT.base + 0.9, 0.4), -10);

      // 第 21 句：写规格的会话框（灰），当前
      T.enter(T.$('sess'), T.p(t, AT.sess, 0.5), 20);
      T.current(T.$('sess'), T.ease(T.p(t, AT.sess + 0.3, 0.4)) * (1 - T.ease(T.p(t, AT.sessOff, 0.4))), 8);

      // Agent：落差只有 12，名字贴纸不掉进字幕带
      var st = [AT.a1, AT.a234, AT.a234 + 0.3, AT.a234 + 0.6];
      for (var i = 0; i < 4; i++) {
        T.enter(T.$('a' + (i + 1)), T.p(t, st[i], 0.5), 12);
        T.enter(T.$('b' + (i + 1)), T.p(t, st[i] + 0.25, 0.4), -10);
      }

      // 第 22 句：四条线连到仓库文件（只连文件和代码，不连左边的会话）
      for (var j = 0; j < 4; j++) {
        var p = T.$('w' + (j + 1)), L = p.getTotalLength();
        var pw = T.ease(T.p(t, AT.wires + j * 0.2, 0.7));
        p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - pw);
        p.style.opacity = pw > 0 ? 1 : 0;
      }    }
  });
</script>
