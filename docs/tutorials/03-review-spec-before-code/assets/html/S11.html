<html lang="zh-CN" data-frame-id="S11">
<head>

<title>S11 · 对抗审：说明</title>
<link rel="stylesheet" href="theme.css">
<style>
  #hdr { left: 60px; top: 70px; font-family: var(--display); font-weight: 800; font-size: 52px; }

<div id="stage">

<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  // 节点时刻（秒，画面内）。按录音实测（frame-times.py，2026-10-25），词首字开始时间减 0.2 秒。
  var AT = {
    head: 0.0,                                          // 第 1 句：标题贴纸
    pur: 1.8, pur2: 9.24, purEnd: 12.88,                  // 第 2 句：目的卡进场并当前；第 3 句：后半句出现；12.3 当前结束
    ang: [14.44, 15.64, 17.0], angEnd: [15.64, 17.0, 19.44],// 第 4 句：三个角度依次进场并当前
    note: 19.64                                         // 第 5 句：旁注「平常开两个，高风险三个」，留到页末
  };

  // 当前：先淡入 0.2 秒、b 之前淡出 0.2 秒，相邻两段首尾相接，同一时刻只有一个。
  function on(t, a, b) { return T.ease(T.p(t, a, 0.2)) * (1 - T.ease(T.p(t, b - 0.2, 0.2))); }
  function cur(el, g, size) {
    T.current(el, g, size || 0.001);
    if (g === 0) { el.style.outline = 'none'; el.style.boxShadow = size ? size + 'px ' + size + 'px 0 #161616' : 'none'; }
  }

  Stage({
    duration: 24.00,
    init: function () { return T.fonts(document.body.textContent); },
    render: function (t) {
      T.enter(T.$('hdr'), T.p(t, AT.head, 0.45), -14);

      // 说明卡：随口播进场，留到页末
      T.enter(T.$('pur'), T.p(t, AT.pur, 0.45), 16);
      T.$('pur2').style.opacity = T.ease(T.p(t, AT.pur2, 0.4));
      cur(T.$('pur'), on(t, AT.pur + 0.1, AT.purEnd), 10);
      T.enter(T.$('angTab'), T.p(t, AT.ang[0], 0.45), -10);
      ['g1', 'g2', 'g3'].forEach(function (id, i) {
        T.enter(T.$(id), T.p(t, AT.ang[i], 0.45), 16);
        cur(T.$(id), on(t, AT.ang[i], AT.angEnd[i]), 10);
      });
      T.enter(T.$('note'), T.p(t, AT.note, 0.45), -10);
    }
  });
</script>
