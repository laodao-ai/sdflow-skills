  var CUE = {

  function on(t, a, b) { return T.ease(T.p(t, a, 0.4)) * (1 - T.ease(T.p(t, b, 0.4))); }
  function cur(el, g, size) {
    T.current(el, g, size);
    if (g === 0) el.style.outline = 'none';
  }

  Stage({
    duration: 11.20,
    init: function () { return T.fonts(T.$('stage').textContent); },
    render: function (t) {
      T.enter(T.$('sumTab'), T.p(t, CUE.tab, 0.45), -12);
      for (var i = 0; i < 4; i++) {
        var c = T.$('s' + (i + 1));
        // 讲到这一格才出现；出现后留到页末
        T.enter(c, T.p(t, CUE.lit[i], 0.45), 16);
        cur(c, on(t, CUE.lit[i] + 0.2, i < 3 ? CUE.lit[i + 1] : 999), 10);
        if (i > 0) {
          var a = T.$('a' + i);
          a.style.opacity = T.ease(T.p(t, CUE.lit[i], 0.4));
        }
      }
    }
