<script>
  // 口播节点（秒，页内）：按录音实测（frame-times.py，2026-10-25），取词首字实测开始时间减 0.2 秒。
  var AT = {
    head: 0.2,                    // 150 句开口：说明卡落下，「新会话 · 同一模型 · 只问一句」当前
    prompt: 8.28, headEnd: 11.16,   // 念到「你自己审一下这份规格」：当前换到提示词，151 句开口淡出
    t3: 11.26, t3End: 13.0,        // 151 句：「每次约 3 分钟」，152 句开口淡出当前

    n1: 20.44, g1End: 22.74,       // 念到「三次都查到的只有 2 条」：旁标，#1、#2 当前
    n3: 22.84, g3End: 25.46,       // 念到「有 4 条只有一次」：旁标，#3、#6、#11、#13 当前
    win: 3.8,                     // 150 句开口：三个实录窗口连标签依次落下，结论行同时出
    concl: [25.6, 26.3, 27.0], conclEnd: 29.24, // 154 句：三行结论依次当前，一次一个
    last: 29.24                   // 155 句开口：末行
  };

  function on(t, a, b) { return T.ease(T.p(t, a, 0.3)) * (1 - T.ease(T.p(t, b, 0.3))); }
  // 说明卡里一行的当前：只画黄色描边加外发光。
  function line(el, g) {
    el.style.outline = g > 0 ? '5px solid rgba(245,207,74,' + g + ')' : 'none';
    el.style.outlineOffset = '2px';
    el.style.boxShadow = '0 0 30px rgba(245,207,74,' + (0.45 * g) + ')';
  }
  // 实录窗口的当前：同 line，但保留窗口的 12px 墨色硬投影
  function wline(el, g) {
    el.style.outline = g > 0 ? '5px solid rgba(245,207,74,' + g + ')' : 'none';
    el.style.outlineOffset = '4px';
    el.style.boxShadow = '12px 12px 0 #161616, 0 0 30px rgba(245,207,74,' + (0.45 * g) + ')';
  }
  // 小表里一组行的当前：黄描边 7px，离组 4px，空隙填奶白（卡底色）
  function grp(el, g) {
    el.style.boxShadow = '0 0 0 2px rgba(242,239,230,' + g + '), 0 0 0 6px rgba(245,207,74,' + g + ')';
  }

  var REC = [
    { id: 'v1', sec: 0.1 },
    { id: 'v2', sec: 0.1 },
    { id: 'v3', sec: 0.1 }
  ];
  // 定位到 sec 秒，等 seeked 再等一帧。三格都是静止一帧，只在 init 里定位一次，render 不再碰录像。
  function still(rec) {
    var v = T.$(rec.id);
    return new Promise(function (resolve) {
      function seek() {
        v.addEventListener('seeked', function () { requestAnimationFrame(function () { resolve(); }); }, { once: true });
        v.currentTime = rec.sec;
      }
      if (v.readyState >= 1) seek();
      else v.addEventListener('loadedmetadata', seek, { once: true });
    });
  }

  Stage({
    duration: 34.24,
    init: function () { return Promise.all([Promise.all(REC.map(still)), T.fonts(T.$('stage').textContent)]); },
    render: function (t) {
      var i;
      // 150 句：三个窗口依次落下（结论行同时出）；154 句：三行结论依次当前，同一时刻一个

      var h = T.$('h1');
      T.enter(h, T.p(t, AT.head, 0.45), -12);
      line(h.querySelector('.l1'), on(t, AT.head + 0.3, AT.prompt));
      line(h.querySelector('.l2'), on(t, AT.prompt, AT.headEnd));

      // 151 句：说明卡右端的「每次约 3 分钟」，一次当前
      T.enter(T.$('t3'), T.p(t, AT.t3, 0.4), 14);
      T.current(T.$('t3'), on(t, AT.t3 + 0.3, AT.t3End), 8);

      // 152 句：数字卡，两行依次
      T.enter(T.$('sum'), T.p(t, AT.s1 - 0.1, 0.45), 14);
      T.$('s1').style.opacity = T.ease(T.p(t, AT.s1, 0.35));
      T.$('s2').style.opacity = T.ease(T.p(t, AT.s2, 0.35));
      T.current(T.$('sum'), on(t, AT.s1 + 0.2, AT.sumEnd), 10);

      // 153 句：小表，七行依次出现，旁标与分组当前
      T.enter(T.$('tb'), T.p(t, AT.tb, 0.45), 14);
      var rows = T.all('.r');
      for (i = 0; i < rows.length; i++) rows[i].style.opacity = T.ease(T.p(t, AT.tb + 0.3 + i * 0.3, 0.35));
      T.$('n1').style.opacity = T.ease(T.p(t, AT.n1, 0.35));
      T.$('n3').style.opacity = T.ease(T.p(t, AT.n3, 0.35));
      grp(T.$('g1'), on(t, AT.n1, AT.g1End));
      grp(T.$('g3'), on(t, AT.n3, AT.g3End));

      // 154 句的结论当前见上

      // 155 句：末行
      T.enter(T.$('last'), T.p(t, AT.last, 0.45), 12);
    }
  });
</script>
