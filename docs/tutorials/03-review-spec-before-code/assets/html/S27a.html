<html lang="zh-CN" data-frame-id="S27a">
<head>

<div id="stage">
  <svg id="lines" viewBox="0 0 1920 930" aria-hidden="true">

    <polygon id="arh" points="552,768 588,768 570,788" fill="#161616"/>
  </svg>

  <div class="chip" id="q1" data-r="-2" style="left:80px;top:40px;font-size:52px">改进：加一条领域规则</div>

<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  // 节点时刻（秒，页内）：按录音实测（frame-times.py，2026-10-25），词首字开始时间减 0.2 秒。
  var CUE = {
    cl: 2.52, rows: [3.12, 3.52, 3.92],  // 188 句念到「新规则」（2.72）：后端清单卡与已有规则（淡显）；三行间隔不变
    nr: 7.56, nrEnd: 12.82,              // 189 句念到「加一条」（7.76）：新行（当前）；nrEnd = 190 句起点前 0.3 秒
    ar: 12.92, rv: 13.32, rvEnd: 18.26,  // 190 句念到「下次」（13.12）、「领域审」（13.52）：箭头与领域审卡（当前）；rvEnd = 191 句起点前 0.3 秒
    yk: 20.6                             // 191 句念到「踩过的坑」（20.80）：一行
  };
  var P = T.p, E = T.ease;
  function span(t, a, b) { return E(P(t, a, 0.4)) * (1 - E(P(t, b, 0.3))); }

  Stage({
    duration: 23.36,
    init: function () { return T.fonts(T.$('stage').textContent); },
    render: function (t) {
      // 188 句：开头标题贴纸，0–1.0 秒在正中放大，1.0–1.6 秒缩小移到左上。
      var q = T.$('q1'), W = q.offsetWidth, H = q.offsetHeight, m = E(P(t, 1.0, 0.6));
      q.style.opacity = E(P(t, 0, 0.4));
      q.style.transform = 'translate(' + ((1 - m) * (960 - (80 + W / 2))) + 'px,' + ((1 - m) * (470 - (40 + H / 2))) + 'px) scale(' + (1.7 - 0.7 * m) + ') rotate(-2deg)';

      // 188 句：后端清单卡，已有规则淡显。
      T.enter(T.$('cl'), P(t, CUE.cl, 0.5), 16);
      CUE.rows.forEach(function (a, i) { T.$('r' + (i + 1)).style.opacity = .65 * E(P(t, a, 0.4)); });

      // 189 句：新加一行。
      T.enter(T.$('nr'), P(t, CUE.nr, 0.45), 12);
      T.$('nr').style.opacity = E(P(t, CUE.nr, 0.45));
      T.current(T.$('nr'), span(t, CUE.nr + 0.3, CUE.nrEnd), 8);

      // 190 句：箭头指向「领域审 → 交人拍板」。
      var ap = E(P(t, CUE.ar, 0.5));
      T.$('ar').style.strokeDasharray = '1';
      T.$('ar').style.strokeDashoffset = String(1 - ap);
      T.$('ar').style.opacity = ap > 0 ? 1 : 0;
      T.$('arh').style.opacity = E(P(t, CUE.ar + 0.4, 0.2));
      T.enter(T.$('rv'), P(t, CUE.rv, 0.45), 14);
      T.current(T.$('rv'), span(t, CUE.rv + 0.3, CUE.rvEnd), 10);

      // 191 句：你的坑 → 加进你的清单。
      T.enter(T.$('yk'), P(t, CUE.yk, 0.45), 14);
    }
  });
</script>
