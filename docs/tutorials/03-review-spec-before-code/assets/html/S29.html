<html lang="zh-CN" data-frame-id="S29">
<head>
<meta charset="utf-8">
<title>S29 · 回到开头：五章</title>
<link rel="stylesheet" href="theme.css">
<style>
  :root { --notyet: rgba(22,22,22,.65); }
  .shell { background: transparent; border-color: var(--notyet); color: var(--notyet); box-shadow: none; }
  #qw { left: 60px; top: 44px; transform-origin: 0 0; }
  #qw .chip { left: 0; top: 0; font-family: var(--display); font-weight: 800; font-size: 44px; }
  #pre { top: 52px; font-family: var(--display); font-weight: 800; font-size: 40px; }

  /* 五章：一章一张卡，卡内用卡内坐标。行间 28px 以上，fin 下沿 884，黄框外扩 17px 后仍在 930 以内 */
  .row { left: 90px; width: 1740px; padding: 0; }
  /* 10-24 五行整体下移 36px，给顶上两张贴纸让位（作者：标签卡被盖住） */
  #r1 { top: 170px; height: 148px; } #r2 { top: 342px; height: 80px; }
  #r3 { top: 446px; height: 80px; } #r4 { top: 550px; height: 80px; } #rm { top: 686px; height: 80px; }
  /* 第 5 章「一句话『魔法咒语』」与前四章之间的横虚线（S06 是竖虚线） */
  #sep { position: absolute; left: 90px; top: 658px; width: 1740px; height: 0; border-top: 5px dashed var(--ink); opacity: 0; }
  .row .nm { position: absolute; left: 36px; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .row .nm .num { width: 52px; height: 52px; font-size: 28px; }
  .row .nm .big { font-size: 46px; line-height: 1; }
  #r1 .nm { top: 38px; } #r2 .nm, #r3 .nm, #r4 .nm, #rm .nm { top: 12px; }
  .row .val { position: absolute; font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; white-space: nowrap; color: var(--ink); }
  .row .val span { opacity: 0; }
  /* 五行右半内容统一从 x=450 起（原 410 / 440 交替） */
  #v1 { top: 52px; left: 450px; } #v2, #v3, #v4 { top: 17px; left: 450px; }
  .row .tick { position: absolute; right: 22px; width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%;
               background: var(--cream); border: 4px solid var(--ink); color: var(--ink);
               display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 32px; opacity: 0; }
  #k1 { top: 38px; } #k2, #k3, #k4, #km { top: 12px; }

  /* 缩略图：只留三层清单塔 */
  /* 三层塔：每层 34px 高、字 26px，层间 4px，不叠字；「分层清单」靠左边那行短语，塔下不再加说明 */
  .th { top: 4px; width: 190px; height: 134px; padding: 0; border-width: 4px; box-shadow: 7px 7px 0 var(--ink); }
  .th .art { position: absolute; left: 12px; right: 12px; top: 10px; }
  #t2 { left: 1440px; }
  .tw { margin: 0 auto 4px; height: 34px; box-sizing: border-box; border-radius: 6px;
        background: var(--ink); color: var(--cream); font-weight: 700; font-size: 26px; line-height: 34px;
        display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  /* 配色：五章全奶白，贴纸也是奶白（紫只留给「另一个模型」，2026-10-25 改） */
  /* 10-25 第五章名改为「一句话『魔法咒语』」变长（到 x 约 520），贴纸从 450 右移到 570 */
  #say { left: 570px; top: 10px; font-size: 34px; line-height: 1.2; padding: 2px 18px; }
  /* 末句：五章下方一行大字，当前留到页末 */
  #fin { left: 90px; top: 794px; width: 1740px; height: 72px; padding: 0; display: flex; align-items: center; justify-content: center; }
  #fin .big { font-size: 56px; line-height: 1; white-space: nowrap; }

<body>
<div id="stage">
  <div class="abs" id="qw"><div class="chip" id="q" data-r="-2">AI 写的 Spec，能直接拿去生成代码吗？</div></div>
  <div class="chip" id="pre" data-r="1.5">先审一轮再说</div>

  <!-- ① AI 怎么审 -->
  <div class="card shell row" id="r1" data-r="0">
    <div class="nm"><span class="num">1</span><span class="big">AI 怎么审</span></div>
    <div class="val" id="v1"><span id="v1a">分几路</span><span id="v1b"> · 分层清单</span><span id="v1c"> · 换模型</span><span id="v1d"> · 先核引用再裁决</span></div>
    <div class="card th" id="t2" data-r="-1.5">
      <div class="art"><div class="tw" style="width:80px">Go</div><div class="tw" style="width:120px">后端</div><div class="tw" style="width:160px">通用</div></div>
    </div>
    <div class="tick" id="k1">✓</div>
  </div>

  <!-- ② 人怎么拍板 -->
  <div class="card shell row" id="r2" data-r="0">
    <div class="nm"><span class="num">2</span><span class="big">人怎么拍板</span></div>
    <div class="val" id="v2"><span id="v2a">看报告 · 提意见 · 拍板批准</span></div>
    <div class="tick" id="k2">✓</div>
  </div>

  <!-- ③ 值不值得 -->
  <div class="card shell row" id="r3" data-r="0">
    <div class="nm"><span class="num">3</span><span class="big">值不值得</span></div>
    <div class="val" id="v3"><span id="v3a">不确定性少了</span><span id="v3b"> · 早发现</span></div>
    <div class="tick" id="k3">✓</div>
  </div>

  <!-- ④ 局限与改进 -->
  <div class="card shell row" id="r4" data-r="0">
    <div class="nm"><span class="num">4</span><span class="big">局限与改进</span></div>
    <div class="val" id="v4"><span id="v4a">查不到的</span><span id="v4b"> → 加进清单</span></div>
    <div class="tick" id="k4">✓</div>
  </div>

  <div id="sep"></div>

  <!-- ⑤ 一句话「魔法咒语」（流程之外） -->
  <div class="card shell row" id="rm" data-r="0" data-lit="242,239,230">
    <div class="nm"><span class="num">5</span><span class="big">一句话「魔法咒语」</span></div>
    <div class="chip" id="say" data-r="1.5">有没有更简洁、更便宜的方案？</div>
    <div class="tick" id="km">✓</div>
  </div>

  <div class="card" id="fin" data-r="0.8"><div class="big">需求做成什么样：你来决策</div></div>
</div>
<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  var NOTYET = [63, 66, 70], INK = [22, 22, 22];
  function L(id) { return T.$(id); }
  function win(t, a, b) { return T.ease(T.p(t, a, 0.4)) * (1 - T.ease(T.p(t, b, 0.4))); }
  function ramp(t, a) { return T.ease(T.p(t, a, 0.4)); }
  // 导航项：没讲到（淡墨）→ 讲过：描边、字色、底色；里面的编号圆片跟着变。
  function lit(el, p) {
    var c = T.mix(NOTYET, INK, p);
    [el].concat(Array.prototype.slice.call(el.querySelectorAll('.num'))).forEach(function (e) {
      var base = (e === el && el.getAttribute('data-lit')) || '242,239,230';   // 本元素点亮后的底色；里面的 .num 一律奶白
      e.style.background = 'rgba(' + base + ',' + p + ')';
      e.style.borderColor = c;
      e.style.color = c;
    });
  }
  // 「当前」描边；a = 硬投影的不透明度（空壳传点亮进度）。
  function cur(el, g, s, a) {
    T.current(el, g, s);
    if (a != null) el.style.boxShadow = el.style.boxShadow.replace(/#161616|rgb\(22, 22, 22\)/g, 'rgba(22,22,22,' + a + ')');
    if (g === 0) el.style.outline = 'none';
  }

  // 口播时刻（秒，画面内）：按录音实测（frame-times.py，2026-10-25），词首字开始时间减 0.2 秒。
  var AT = {
    q: 0, qHold: 1.15, qMove: 0.6,         // 第 208 句开口（0.00，不能小于 0）：问题贴纸正中放大，停约 1 秒，0.6 秒缩小移到左上（qHold、qMove 不改）
    shell: 1.8,                            // 落位后：五章列表（导航）（不改）
    pre: 8.29,                             // 第 209 句：念到「先审一轮再说」（先 8.49）
    r1: 11.01, v1a: 11.33, v1b: 12.02, t2: 12.36, v1c: 13.04, v1d: 13.73, k1: 16.77, e1: 17.17,   // 第 210 句（10-25 合句）：①；v1a 分几路 11.53，v1d 先核引用 13.93，v1b/t2/v1c 口播没念，按 v1a–v1d 区间等比缩放；e1 = r2，k1 = e1 前 0.4 秒
    r2: 17.17, v2a: 18.61, k2: 22.69, e2: 23.09,                                          // 第 211 句：②；v2a 看评审报告 18.81
    r3: 23.09, v3a: 26.21, v3b: 27.81, k3: 29.65, e3: 30.05,                              // 第 212 句：③；v3a 不确定性少了 26.41，v3b 早发现 28.01
    r4: 30.05, v4a: 30.05, v4b: 33.01, k4: 36.29, e4: 36.69,                              // 第 213 句：④；v4a 审不出来的 30.25（与 r4 同刻），v4b 加进清单 33.21
    rm: 36.69, say: 39.33, km: 41.97, e5: 42.37,                                          // 第 214 句：⑤；say 有没有更简洁 39.53
    fin: 45.41                                                                            // 第 215 句：念到「需求最后做成什么样」（需 45.61），当前留到页末
  };
  var Q_SCALE = 1.7, Q_CENTER = [960, 500];

  Stage({
    duration: 50.01,
    init: function () { return T.fonts(T.$('stage').textContent); },
    render: function (t) {
      T.tilt();
      // 问题贴纸
      T.enter(L('q'), T.p(t, AT.q, 0.45), -16);
      var qw = L('qw'), q = L('q');
      var mv = T.ease(T.p(t, AT.qHold, AT.qMove));
      var sc = Q_SCALE + (1 - Q_SCALE) * mv;
      var fx = Q_CENTER[0] - Q_SCALE * q.offsetWidth / 2 - 60, fy = Q_CENTER[1] - Q_SCALE * q.offsetHeight / 2 - 44;
      qw.style.transform = 'translate(' + (fx * (1 - mv)) + 'px,' + (fy * (1 - mv)) + 'px) scale(' + sc + ')';
      // 「先审一轮再说」：贴在问题贴纸右边
      L('pre').style.left = (60 + q.offsetWidth + 60) + 'px';
      T.enter(L('pre'), T.p(t, AT.pre, 0.45), 14);

      // 五章列表（导航）：落位后一章接一章落下
      ['r1', 'r2', 'r3', 'r4', 'rm'].forEach(function (id, i) { T.enter(L(id), T.p(t, AT.shell + i * 0.12, 0.45), 14); });
      L('sep').style.opacity = T.ease(T.p(t, AT.shell + 0.48, 0.45));
      // 五章点亮 + 当前
      [['r1', AT.r1, AT.e1], ['r2', AT.r2, AT.e2], ['r3', AT.r3, AT.e3], ['r4', AT.r4, AT.e4], ['rm', AT.rm, AT.e5]].forEach(function (a) {
        var e = L(a[0]), p = ramp(t, a[1]);
        lit(e, p);
        cur(e, win(t, a[1], a[2]), 10, p);
      });

      // 一行短语、缩略图、那句话：讲到时才出现
      ['v1a', 'v1b', 'v1c', 'v1d', 'v2a', 'v3a', 'v3b', 'v4a', 'v4b'].forEach(function (id) { L(id).style.opacity = ramp(t, AT[id]); });
      T.enter(L('t2'), T.p(t, AT.t2, 0.5), 16);
      T.enter(L('say'), T.p(t, AT.say, 0.5), 16);

      // 末句大字：当前留到页末
      T.enter(L('fin'), T.p(t, AT.fin, 0.5), 16);
      cur(L('fin'), ramp(t, AT.fin + 0.2), 10);

      // 打勾
      ['k1', 'k2', 'k3', 'k4', 'km'].forEach(function (id) {
        var e = L(id), p = ramp(t, AT[id]);
        e.style.opacity = p;
        e.style.transform = 'scale(' + (0.6 + 0.4 * p) + ')';
      });
    }
  });
</script>
</body>
</html>
