<div id="stage">

      <div class="row" id="r2">

<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  // 节点时刻（秒）：已按录音实测句子起点对齐（2026-11-03）。
  var CUE = {
    tab: 0.211,                // 第 1 句：Matt Pocock 名字标签先落下
    tk: 3.158,                 // 「行为」前 0.2 秒：ticket 卡落下（卡里一开始就有「行为」，不放空卡）
    b1: 3.368, b2: 4.842,        // 「行为」「验收」
    r2: 8.0,                 // 第 2 句：标签 + 原文窗口
    layer: 9.176, pierce: 9.608, // 「竖着切」：四层依次落下，竖线打穿
    r3: 10.0, r3b: 10.917      // 第 3 句
  };
  // 每行的高度（含下边距），行出现时卡随之变高
  var H1 = 128, H2 = 278, H3 = 90;

  // 2026-11-03：节点按本期 voice.srt 实测句子起点重排。
  Stage({
    duration: 12.580,
    init: function () { return T.fonts('早期计划测试代码的行为验收按能单独验收来切做完一个切片自己就演示或验证留到实现'); },
    render: function (t) {
      T.enter(T.$('old'), T.p(t, 0, 0.4), 10);

      // ticket 卡：随行出现变高（高 = 上边距 + 已出现的行；r1、r2 自带下边距 28，r3 没有，所以 r3 出现时补 28）
      var e1 = T.ease(T.p(t, CUE.b1, 0.4)), e2 = T.ease(T.p(t, CUE.r2, 0.5)), e3 = T.ease(T.p(t, CUE.r3, 0.4));
      T.$('tk').style.height = Math.max(60, 28 + H1 * e1 + H2 * e2 + H3 * e3 + (e3 > 0 ? 28 * e3 : 0)) + 'px';
      T.enter(T.$('tk'), T.p(t, CUE.tk, 0.45), 14);
      T.enter(T.$('tkTab'), T.p(t, CUE.tab, 0.45), -12);

      // 第 1 句：两块
      T.$('r1').style.display = e1 > 0 ? 'flex' : 'none';
      T.$('b1').style.opacity = e1;
      T.$('b1').style.transform = 'translateY(' + ((1 - e1) * 12) + 'px)';
      var eb2 = T.ease(T.p(t, CUE.b2, 0.4));
      T.$('b2').style.opacity = eb2;
      T.$('b2').style.transform = 'translateY(' + ((1 - eb2) * 12) + 'px)';

      // 第 2 句：原文窗口、四层、竖线
      T.$('r2').style.display = e2 > 0 ? 'flex' : 'none';
      T.$('r2').style.opacity = e2;
      T.$('qw').style.transform = 'translateY(' + ((1 - e2) * 14) + 'px)';
      T.$('cap').style.opacity = e2;
      ['L1', 'L2', 'L3', 'L4'].forEach(function (id, i) {
        var q = T.ease(T.p(t, CUE.layer + i * 0.25, 0.35));
        T.$(id).style.opacity = q;
        T.$(id).style.transform = 'translateY(' + ((1 - q) * -12) + 'px)';
      });
      T.wipe(T.$('pierce'), T.p(t, CUE.pierce, 0.7), 'y');
      T.$('pierce').style.opacity = t >= CUE.pierce ? 1 : 0;

      // 第 3 句：代码 → 留到实现
      T.$('r3').style.display = e3 > 0 ? 'flex' : 'none';
      T.$('r3').style.opacity = e3;
      T.$('r3b').style.opacity = T.ease(T.p(t, CUE.r3b, 0.4));
    }
  });
</script>
