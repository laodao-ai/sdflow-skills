     示意，不标「实录」。上：一张循环卡，中间 ticket，验收项一条一条往外引，转一圈回到 ticket 上打勾；下：三张小卡，两个坏测试、一条做法。
     - 第 1–2 句：循环卡（标签「TDD 测试驱动开发：先写测试，再写实现」）与卡里的 ticket（三条验收项）从开头就在；卡内左上小字点三家名（storyboard「两家点名」：S17 首句允许）。
     - 第 3 句（第 11 轮改为「从 ticket 上挑一条验收项，写一个测试，跑一下，必须失败，也就是红的。」，比原来长约 1.3 秒，后面节点顺延）：ticket → ① 挑一条验收项 → ② 写一个测试 → ③ 运行，红。
     - 第 4 句：④ 写刚好够的实现 → ⑤ 运行，绿 → 回到 ticket，打掉第一条勾（下一条）。
     - 第 5–6 句：下方反例小卡「恒真」（第 5 句出）。第 7–8 句：反例小卡「盯内部」（第 7 句出）。
     - 第 9–10 句：下方一格做法「补断言前：先改坏被测代码，确认会红」（第 9 句出）；第 10 句补「不红 = 什么也没测到」。
     - 第 11 句：循环卡右上角贴标签「原样写进派给 agent 的提示词」。
     配色：红、绿只用在 ③ ⑤ 这两格（测试失败 / 通过）；写测试、写实现、做法是执行一侧，琥珀；循环卡标签琥珀（TDD 在执行一侧）；ticket 与两个坏测试用奶白，坏测试不用红（红只表示测试失败）；不用辅助色。
     内容都在 y 920 以内，避开字幕带。

<script>
  // 口播节点（秒，画面内，按每分钟 220 字估算）。
  var AT = {
    base: 0.0,    // 第 1–2 句：循环卡、ticket、三家名
    s2: 11.76,     // 第 3 句：挑验收项 → 写测试 → 红
    s3: 20.64,     // 第 4 句：写实现 → 绿 → 下一条
    s4: 26.72,     // 第 5–6 句：反例，恒真（第 5 句出卡）
    s5: 35.52,     // 第 7–8 句：反例，盯内部（第 7 句出卡）
    s6: 47.92,     // 第 9 句：补断言前先改坏
    s7: 55.946,     // 第 10 句：不红 = 什么也没测到
    s8: 58.506      // 第 11 句：原样写进提示词
  };

  function wire(el, p) {
    var L = el.getTotalLength();
    el.style.strokeDasharray = L; el.style.strokeDashoffset = L * (1 - p);
    el.style.opacity = p > 0 ? 1 : 0;
    el.style.markerEnd = p >= 0.99 ? 'url(#ah)' : 'none';
  }

  // 2026-11-03：节点按本期 voice.srt 实测句子起点重排。
  Stage({
    duration: 63.806,
    init: function () { return T.fonts(T.$('stage').textContent); },
    render: function (t) {
      var P = T.p, E = T.ease;

      // 第 1 句：循环卡与 ticket 一起出
      T.enter(T.$('lc'), P(t, AT.base, 0.5), 16);
      T.enter(T.$('tk'), P(t, AT.base + 0.2, 0.5), 16);
      T.enter(T.$('who'), P(t, AT.base + 3.0, 0.4), -10);

      // 第 3 句：循环前半
      wire(T.$('a0'), E(P(t, AT.s2 + 0.2, 0.4)));
      T.enter(T.$('c1'), P(t, AT.s2 + 0.2, 0.45), 12);
      wire(T.$('a1'), E(P(t, AT.s2 + 2.8, 0.5)));
      T.enter(T.$('c2'), P(t, AT.s2 + 3.0, 0.45), 12);
      wire(T.$('a2'), E(P(t, AT.s2 + 5.4, 0.5)));
      T.enter(T.$('c3'), P(t, AT.s2 + 5.6, 0.45), 12);

      // 第 4 句：循环后半，回到 ticket 打勾
      wire(T.$('a3'), E(P(t, AT.s3 + 0.1, 0.5)));
      T.enter(T.$('c4'), P(t, AT.s3 + 0.4, 0.45), 12);
      wire(T.$('a4'), E(P(t, AT.s3 + 2.8, 0.5)));
      T.enter(T.$('c5'), P(t, AT.s3 + 3.0, 0.45), 12);
      wire(T.$('a5'), E(P(t, AT.s3 + 4.6, 0.5)));
      T.enter(T.$('nx'), P(t, AT.s3 + 4.8, 0.4), -8);
      T.$('i1').textContent = t >= AT.s3 + 5.2 ? '☑ 验收项 1' : '☐ 验收项 1';

      // 第 5–10 句：下方三张卡
      T.enter(T.$('d1'), P(t, AT.s4, 0.5), 14);
      T.enter(T.$('d2'), P(t, AT.s5, 0.5), 14);
      T.enter(T.$('d3'), P(t, AT.s6, 0.5), 14);
      T.enter(T.$('res'), P(t, AT.s7, 0.4), -10);

      // 第 11 句：循环卡右上角的标签
      T.enter(T.$('pt'), P(t, AT.s8 + 0.3, 0.45), -14);
    }
  });
</script>
