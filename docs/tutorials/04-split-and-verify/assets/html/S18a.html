<script>
  // 口播节点（秒，画面内，按每分钟 220 字估算）。
  var AT = {
    hold: 0.876, move: 0.6,   // 第 1 句：问题贴纸正中停到 1.0 秒，0.6 秒缩到左上
    s2: 4.028,                // 第 2 句：提示词卡、空闸口、没人拦
    s3: 8.908,               // 第 3 句：两条路、包裹、哪条路来的
    s4: 15.948,               // 第 4 句：照着代码描出测试
    s5: 20.588                // 第 5 句：从没红过
  };

  function wire(el, p) {
    var L = el.getTotalLength();
    el.style.strokeDasharray = L; el.style.strokeDashoffset = L * (1 - p);
    el.style.opacity = p > 0 ? 1 : 0;
    el.style.markerEnd = p >= 0.99 ? 'url(#ah)' : 'none';
  }
  // 虚线描线：用 clip 从左往右擦出，保留虚线样式
  function trace(id, p) { var el = T.$(id); el.style.opacity = p > 0 ? 1 : 0; el.style.clipPath = 'inset(0 ' + (1 - T.ease(p)) * 100 + '% 0 0)'; }
  function pop(id, p, dy) { T.enter(T.$(id), p, dy === undefined ? 12 : dy); }
  function rise(id, p) { var e = T.ease(p); var el = T.$(id); el.style.opacity = e; el.style.transform = 'translateY(' + (1 - e) * 14 + 'px)'; }

  // 2026-11-03：节点按本期 voice.srt 实测句子起点重排。
  Stage({
    duration: 24.848,
    init: function () { return T.fonts(T.$('stage').textContent); },
    render: function (t) {
      var P = T.p, E = T.ease;

      // 第 1 句：问题贴纸
      T.enter(T.$('hdr'), P(t, 0, 0.45), -14);
      var hw = T.$('hw'), hd = T.$('hdr');
      var mv = E(P(t, AT.hold, AT.move)), S = 1.5, sc = S + (1 - S) * mv;
      var fx = 960 - S * hd.offsetWidth / 2 - 60, fy = 470 - S * hd.offsetHeight / 2 - 46;
      hw.style.transform = 'translate(' + (fx * (1 - mv)) + 'px,' + (fy * (1 - mv)) + 'px) scale(' + sc + ')';

      // 第 2 句：提示词卡（句首前 0.3 秒先进，免得只剩标题超过 3 秒）
      rise('pr', P(t, AT.s2 - 0.3, 0.5));
      var g = E(P(t, AT.s2 + 1.6, 0.4)) * (1 - E(P(t, AT.s3, 0.4)));
      var rb = T.$('rbg');
      rb.style.outline = '5px solid rgba(245,207,74,' + g + ')';
      rb.style.outlineOffset = '4px';
      wire(T.$('w0'), E(P(t, AT.s2 + 3.0, 0.8)));
      T.$('gt').style.opacity = E(P(t, AT.s2 + 3.2, 0.4));
      pop('ex', P(t, AT.s2 + 3.8, 0.4));
      pop('gtl', P(t, AT.s2 + 4.6, 0.4), -8);

      // 第 3 句：两条路汇到同一个包裹
      pop('a1', P(t, AT.s3, 0.4)); wire(T.$('wa'), E(P(t, AT.s3 + 0.4, 0.3))); pop('a2', P(t, AT.s3 + 0.6, 0.4));
      pop('b1', P(t, AT.s3 + 0.9, 0.4)); wire(T.$('wb'), E(P(t, AT.s3 + 1.3, 0.3))); pop('b2', P(t, AT.s3 + 1.5, 0.4));
      wire(T.$('wa2'), E(P(t, AT.s3 + 2.0, 0.6))); wire(T.$('wb2'), E(P(t, AT.s3 + 2.0, 0.6)));
      pop('pk', P(t, AT.s3 + 2.6, 0.5), 14);
      pop('qm', P(t, AT.s3 + 5.6, 0.45), -10);

      // 第 4 句：再补测试 → 测试卡的几行照着代码卡描出来
      T.current(T.$('b2'), E(P(t, AT.s4, 0.4)) * (1 - E(P(t, AT.s5, 0.4))), 7);
      wire(T.$('wd'), E(P(t, AT.s4 + 0.2, 0.4)));
      pop('cc', P(t, AT.s4 + 0.4, 0.45)); pop('tc', P(t, AT.s4 + 0.8, 0.45));
      for (var i = 1; i <= 3; i++) {
        trace('d' + i, P(t, AT.s4 + 1.4 + (i - 1) * 0.6, 0.5));
        T.$('u' + i).style.opacity = E(P(t, AT.s4 + 1.8 + (i - 1) * 0.6, 0.3));
      }
      pop('nt', P(t, AT.s4 + 3.6, 0.4), -8);

      // 第 5 句：印章
      var s = E(P(t, AT.s5 + 0.6, 0.35));
      T.$('stamp').style.opacity = s;
      T.$('stamp').style.transform = 'rotate(-10deg) scale(' + (1 + 1.2 * (1 - s)) + ')';
    }
