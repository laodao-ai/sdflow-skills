<!-- S21 · 机制动画（上排两张实录，停机单示意）· script 147–151「测不了的，比如固件要上板子，有的操作得人手去点。……平时你不用盯着每个 ticket，它停下来的时候，才需要你。」

     左上证据行是同一示例项目的实录，与 S20 第一行一致（task6-verify.md:16，命令只留 scripts/test.sh unit），标「实录 · 示例项目」；停机单是示意；左下角 mqtt-console 小卡是原文摘要，标「实录 · 原文摘要」。
     - 第 1 句：左「测得了 → 证据行」（一行证据）；念到「测不了的」时右边出「测不了」实录卡：e2e · — · 未覆盖 · 依据；念到「得人手去点」时下面出一行「人工真机冒烟：未执行，由人在收尾阶段做」。

<script>
  // 口播节点（秒，画面内，按每分钟 220 字估算）。
  var AT = {
    base: 0.0,    // 第 1 句：测得了 → 证据行；念到「测不了的」出右边
    no: 1.49,      // 「测不了的」
    s2: 5.68,      // 第 2 句：写「未覆盖」或停下来（画面不新增）
    s3: 10.32,     // 第 3 句：e2e 未覆盖一行、人工真机冒烟一行加黄框
    s4: 19.28,     // 第 4 句：停机单标题、人、四项、mqtt-console 小卡
    s5: 27.92      // 第 5 句：人当前
  };

  function wire(el, p) {
    var L = el.getTotalLength();
    el.style.strokeDasharray = L; el.style.strokeDashoffset = L * (1 - p);
    el.style.opacity = p > 0 ? 1 : 0;
    el.style.markerEnd = p >= 0.99 ? 'url(#ah)' : 'none';
  }
  function pop(id, p, dy) { T.enter(T.$(id), p, dy === undefined ? 12 : dy); }

  // 2026-11-03：节点按本期 voice.srt 实测句子起点重排。
  Stage({
    duration: 33.540,
    init: function () { return T.fonts('测得了证据行测不了上板子要人手点的原生菜单层命令结果依据注明本项目没有层实录示例项目人工真机冒烟未执行由在收尾阶段做未覆盖停机单卡在哪查过什么改了什么下一步怎么恢复人停下来的时候才需要你实录原文摘要自动化点不开停下授权后补完在最终提交上重跑'); },
    render: function (t) {
      var P = T.p, E = T.ease;

      // 第 1 句
      pop('ok', P(t, AT.base, 0.5), 14);
      pop('no', P(t, AT.no, 0.5), 14);
      pop('smoke', P(t, AT.no + 3.0, 0.4), 6);

      // 第 3 句：重点黄框（念到「未覆盖」「真机冒烟」），留到页末
      var hl1 = E(P(t, AT.s3 + 3.6, 0.4)), hl2 = E(P(t, AT.s3 + 7.2, 0.4));
      var row = T.$('e2eRow'), sm = T.$('smoke');
      row.style.outline = '7px solid rgba(245,207,74,' + hl1 + ')'; row.style.outlineOffset = '-7px';
      sm.style.outline = '7px solid rgba(245,207,74,' + hl2 + ')'; sm.style.outlineOffset = '3px';

      // 第 4 句：停下来交给人，停机单四项逐项出
      pop('sheet', P(t, AT.s4, 0.5), 14);
      wire(T.$('w1'), E(P(t, AT.s4 + 0.2, 0.4)));
      pop('human', P(t, AT.s4 + 0.6, 0.5), 12);
      wire(T.$('w2'), E(P(t, AT.s4 + 1.0, 0.4)));
      var at3 = [0.2, 2.0, 3.6, 4.8];
      for (var i = 0; i < 4; i++) pop('p' + (i + 1), P(t, AT.s4 + at3[i], 0.35), 6);
      pop('mq', P(t, AT.s4 + 5.8, 0.5), 14);
      var m = [0.4, 1.2, 2.0, 2.8];
      for (var j = 0; j < 4; j++) pop('m' + (j + 1), P(t, AT.s4 + 6.2 + m[j], 0.3), 6);

      // 第 5 句：人，当前
      T.current(T.$('human'), E(P(t, AT.s5, 0.4)), 12);
      pop('only', P(t, AT.s5 + 0.4, 0.4), -8);
    }
  });
</script>
