<script>
  // 七个 ticket 卡，位置同 S01：x = 140 + 240 i。先建 DOM，再加载 theme.js（自动倾角要看到这些元素）。
  (function () {
    var html = '';
    for (var i = 0; i < 7; i++) {
      html += '<div class="card tk" id="tk' + i + '" style="left:' + (140 + 240 * i) + 'px;top:90px"><span class="w">ticket</span><span class="n">' + (i + 1) + '</span></div>';

<script src="lib/stage.js"></script>
<script src="theme.js"></script>
<script>
  // 口播时刻（秒，画面内，估算）。
  var AT = {
    rec: 0, tk0: 0.071, tkGap: 0.12,     // 第 1 句：七个 ticket
    br: 3.624, lock: 3.93, good: 6.685,        // 第 2 句：锁、质量高
    w1: 8.136, w2: 9.177, w3: 9.698,         // 第 3 句：三根线（「新建」「删除」）
    seam: 12.366, seamOff: 15.36, fall: 12.626,  // 第 3 句「不归哪一个 ticket 管」起黄描边，到句末淡出；「没人接」标签
    src: 15.36, key: 15.722,                 // 第 4 句：原文窗口、黄框
    pt: 19.12                              // 第 5 句：点题卡
  };
  var YELLOW = '245,207,74';

  function draw(el, p) { el.style.strokeDasharray = 1; el.style.strokeDashoffset = 1 - T.ease(p); el.style.opacity = p > 0 ? 1 : 0; }
  function frame(box, target, g) {
    var r = T.rect(target);
    box.style.left = (r.x - 10) + 'px'; box.style.top = (r.y - 4) + 'px';
    box.style.width = (r.w + 20) + 'px'; box.style.height = (r.h + 8) + 'px';
    box.style.opacity = g > 0.001 ? 1 : 0;
    box.style.borderColor = 'rgba(' + YELLOW + ',' + g + ')';
    box.style.boxShadow = '0 0 36px rgba(' + YELLOW + ',' + (0.45 * g) + ')';
  }
  // 三张入口卡按线的落点居中摆
  function layout() {
    [['d1', 360], ['d2', 1080], ['d3', 1560]].forEach(function (a) {
      var el = T.$(a[0]); el.style.left = (a[1] - el.offsetWidth / 2) + 'px';
    });
  }

  // 2026-11-10：节点按作者原声 voice.srt 实测句子起点重排（render/audio-tools/retime-frames.py）。
  Stage({
    duration: 26.560,
    init: function () { return T.fonts(T.$('stage').textContent).then(layout); },
    render: function (t) {
      layout();
      T.tilt();
      T.enter(T.$('rec'), T.p(t, AT.rec, 0.4), 10);
      for (var i = 0; i < 7; i++) T.enter(T.$('tk' + i), T.p(t, AT.tk0 + i * AT.tkGap, 0.4), 16);

      // 第 2 句：ticket 1、2 → 锁
      draw(T.$('br'), T.p(t, AT.br, 0.4));
      var pl = T.p(t, AT.lock, 0.4);
      T.$('lock').style.opacity = T.ease(pl);
      T.$('lock').style.transform = 'translateY(' + (1 - T.ease(pl)) * -14 + 'px)';
      T.enter(T.$('good'), T.p(t, AT.good, 0.4), 12);

      // 第 3 句：三根线
      draw(T.$('w1'), T.p(t, AT.w1, 0.5));
      T.enter(T.$('d1'), T.p(t, AT.w1 + 0.3, 0.35), 10);
      draw(T.$('w2'), T.p(t, AT.w2, 0.9));
      T.enter(T.$('d2'), T.p(t, AT.w2, 0.35), 10);
      draw(T.$('w3'), T.p(t, AT.w3, 1.0));
      T.enter(T.$('d3'), T.p(t, AT.w3, 0.35), 10);
      T.$('x2').setAttribute('opacity', T.ease(T.p(t, AT.w2 + 0.9, 0.3)));
      T.$('x3').setAttribute('opacity', T.ease(T.p(t, AT.w3 + 1.0, 0.3)));
      ['sm1', 'sm2'].forEach(function (id) {
        var el = T.$(id);
        el.style.opacity = T.ease(T.p(t, AT.w2, 0.4));
        T.current(el, T.ease(T.p(t, AT.seam, 0.4)) * (1 - T.ease(T.p(t, AT.seamOff, 0.4))), 0.01);  // 0 会被当成缺省 10，接缝框不要硬投影
      });
      T.enter(T.$('fall'), T.p(t, AT.fall, 0.4), -12);

      // 第 4 句：原文窗口、黄框
      T.enter(T.$('src'), T.p(t, AT.src, 0.45), 14);
      var g = T.ease(T.p(t, AT.key, 0.4));
      if (t >= AT.src + 0.45) frame(T.$('fKey'), T.$('key'), g); else T.$('fKey').style.opacity = 0;

      // 第 5 句：点题卡
      T.enter(T.$('pt'), T.p(t, AT.pt, 0.5), 16);
    }
  });
</script>
