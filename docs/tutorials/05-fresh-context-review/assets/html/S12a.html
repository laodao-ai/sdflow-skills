  <div class="tile" id="a1" data-r="-1.2"><svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"><polygon points="60,12 102,36 102,84 60,108 18,84 18,36"/><polygon points="60,44 74,52 74,68 60,76 46,68 46,52" fill="currentColor" stroke="none"/></svg><div class="name spec" style="--r:-2deg">对照规格</div></div>

<script>
  // 口播节点（秒，画面内，按每分钟 220 字估算；录音后按实测对齐）。
  var AT = {
    ag: 0.074,                    // 第 1 句：五路 Agent 落下
    lit: 5.208, litEnd: 11.425,     // 第 2 句：五路同时亮起
    box: 5.558, wall: 9.236,       // 第 2 句：「每一路都是一个新的 agent」不带开发对话框；「各看各的」隔板
    fun: 11.6, br: 11.711,        // 第 3 句：漏斗、括线与箭头
    fd: 12.098, fdGap: 0.65,      // 第 3 句：发现依次滑到漏斗口
    funCur: 13.315, funEnd: 16.08, // 第 3–4 句：漏斗当前
    rejCur: 16.08, rejOut: 19.714, // 第 4 句：最右那张当前，念到「是不是真的存在」被筛出
    vd: 26.32, vdCur: 26.577,      // 第 5 句：裁决卡
    drop: [26.9, 27.5, 28.1, 28.7],   // 第 5 句：四张发现逐条落进「成立」「不成立」
    rv: 5.12, play: 5.208, playLen: 4.0,   // 第 2 句：录像卡进场，原片 199.0 → 203.0 秒（1 倍速）
    hb: 8.885, sync: 9.236,               // 放完定格后：两个黄框、旁注「同时派出」
    zc: 9.236, zOut: 10.593,              // 黄框后 0.4 秒放大卡长出（0.6 秒）；13.15–13.5 卡与引线收回黄框，缩小开始前收完
    shrink: 10.899, shrinkLen: 0.6,       // 第 2 句念完：缩到右上角，黄框与旁注淡出
    end: 30.56
  };
  // 录像：原片 203.0 秒之后列表不再变。源画面裁切 x 225、y 240 起，1:1；黄框 = 源画面坐标 x1, y1, x2, y2
  var SRC0 = 0.0, SRC1 = 4.0, X0 = 225, Y0 = 232;
  var HB = [['hb1', [266, 330, 506, 498]], ['hb2', [228, 524, 1220, 553]]];   // 六行 agents；code-voice 一行
  var CORNER = { x: 1478, y: 36, k: 0.39 };
  var video = T.$('rec');
  function seekVideo(sec) {
    return new Promise(function (resolve) {
      // 两帧：seeked 之后视频帧要再过一个合成周期才画到屏上（同第 3 期 S17）。
      // 本页另加一道：seeked 后等视频帧真正呈现（requestVideoFrameCallback，300 毫秒兜底），大跨度跳秒时不会截到上一帧。
      function painted() { requestAnimationFrame(function () { requestAnimationFrame(function () { resolve(); }); }); }
      if (Math.abs(video.currentTime - sec) < 0.001 && video.readyState >= 2) { painted(); return; }
      video.addEventListener('seeked', function () {
        var done = false;
        function fin() { if (done) return; done = true; painted(); }
        if (video.requestVideoFrameCallback) { video.requestVideoFrameCallback(fin); setTimeout(fin, 300); } else { fin(); }
      }, { once: true });
      video.currentTime = sec;
    });
  }
  function loaded() {
    return new Promise(function (resolve) {
      if (video.readyState >= 1) { resolve(); return; }
      video.addEventListener('loadedmetadata', function () { resolve(); }, { once: true });
    });
  }
  var GEO = null;
  function layoutBoxes() {
    var holes = '';
    HB.forEach(function (h) {
      var b = T.$(h[0]), r = h[1], pad = 4;
      var x = r[0] - X0 - pad, y = r[1] - Y0 - pad, w = r[2] - r[0] + 2 * pad, hh = r[3] - r[1] + 2 * pad;
      b.style.left = x + 'px'; b.style.top = y + 'px'; b.style.width = w + 'px'; b.style.height = hh + 'px';
      holes += ' M' + x + ' ' + y + ' H' + (x + w) + ' V' + (y + hh) + ' H' + x + ' Z';
    });
    // 压暗层挖两个洞（两处黄框同时亮）
    T.$('dim').style.clipPath = 'path(evenodd, "M0 0 H1030 V380 H0 Z' + holes + '")';
    // 一张放大卡对两处黄框，只画一根引线：hb2（code-voice 一行）横在 hb1 正下方，
    // 从 hb1 往下拉的直线都会穿过 hb2（4.7：不穿过黄框），所以引线按两处黄框合起来的范围量，落在 hb2 左下角。
    // 卡从两处黄框合起来的中心长出。在录像卡没有缩放、放大卡没有位移时量（同 S17）。
    var b1 = T.rect(T.$('hb1')), b2 = T.rect(T.$('hb2'));
    var x1 = Math.min(b1.x, b2.x), y1 = Math.min(b1.y, b2.y);
    var box = { x: x1, y: y1, w: Math.max(b1.x + b1.w, b2.x + b2.w) - x1, h: Math.max(b1.y + b1.h, b2.y + b2.h) - y1 };
    var z = T.$('z1'); z.style.transform = 'none';
    var card = T.rect(z);
    GEO = { dx: (box.x + box.w / 2) - (card.x + card.w / 2), dy: (box.y + box.h / 2) - (card.y + card.h / 2), lead: T.lead(box, card) };
  }
  // 发现贴纸的三个位置：起点（各路右侧）→ 漏斗口 → 裁决格
  var START = [[440, 91], [440, 263], [440, 435], [440, 607], [440, 779]];
  var MOUTH = [[905, 172], [1020, 172], [1135, 172], [1250, 172], [1365, 172]];
  var BIN = [[928, 762], [1040, 762], [928, 818], [1243, 762]];   // f1–f3 成立，f4 不成立（卡内坐标换成舞台坐标）
  var OUT = [1480, 290];                                           // f5 被筛出后停的位置
  var CREAM = [242, 239, 230], GRAY = [160, 157, 151];

  function wire(el, p) {
    var L = el.getTotalLength();
    el.style.strokeDasharray = L; el.style.strokeDashoffset = L * (1 - p);
    el.style.opacity = p > 0 ? 1 : 0;
    el.style.markerEnd = (el.id !== 'br' && p >= 0.99) ? 'url(#ah)' : 'none';
  }
  function on(t, a, b) { return T.ease(T.p(t, a, 0.3)) * (1 - T.ease(T.p(t, b - 0.3, 0.3))); }
  function cur(el, g, size) {
    T.current(el, g, size || 0.001);
    if (g === 0) { el.style.outline = 'none'; el.style.boxShadow = size ? size + 'px ' + size + 'px 0 #161616' : 'none'; }
  }
  function lerp(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
  function place(el, xy) { el.style.left = xy[0] + 'px'; el.style.top = xy[1] + 'px'; }

  // 2026-11-10：节点按作者原声 voice.srt 实测句子起点重排（render/audio-tools/retime-frames.py）。
  Stage({
    duration: AT.end,
    init: function () { return Promise.all([loaded(), T.fonts(T.$('stage').textContent)]).then(layoutBoxes); },
    render: function (t) {
      var P = T.p, E = T.ease;

      // 第 2 句：录像卡进场、1 倍速放 4 秒后定格、两个黄框与旁注；第 2 句念完缩到右上角
      T.enter(T.$('rv'), P(t, AT.rv, 0.45), 14);
      var sk = E(P(t, AT.shrink, AT.shrinkLen));
      T.$('rvw').style.transform = 'translate(' + ((CORNER.x - 700) * sk) + 'px,' + ((CORNER.y - 200) * sk) + 'px) scale(' + (1 + (CORNER.k - 1) * sk) + ')';
      var hg = E(P(t, AT.hb, 0.3)) * (1 - E(P(t, AT.shrink, 0.3)));
      HB.forEach(function (h) {
        var b = T.$(h[0]);
        b.style.opacity = hg > 0.001 ? 1 : 0;
        b.style.borderColor = 'rgba(245,207,74,' + hg + ')';
        b.style.boxShadow = '0 0 24px rgba(245,207,74,' + (0.6 * hg) + ')';
      });
      var sy = T.$('sync'), sg = E(P(t, AT.sync, 0.4)) * (1 - E(P(t, AT.shrink, 0.3)));
      sy.style.opacity = sg;
      sy.style.transform = 'translateY(' + ((1 - E(P(t, AT.sync, 0.4))) * -10) + 'px) rotate(-3deg)';
      // 放大卡与引线：黄框后 0.4 秒从黄框处长出；缩小开始前收回黄框（原文随录像卡缩走，4.7「原文滚出窗口的卡和引线一起收起」）
      var zk = E(P(t, AT.zc, 0.6)) * (1 - E(P(t, AT.zOut, AT.shrink - AT.zOut)));
      var z1 = T.$('z1');
      z1.style.opacity = zk;
      z1.style.transform = 'translate(' + ((1 - zk) * GEO.dx) + 'px,' + ((1 - zk) * GEO.dy) + 'px) scale(' + (0.3 + 0.7 * zk) + ')';
      T.leadDraw(GEO.lead, zk);
      // 压暗：卡在画面上就压暗约 0.35，黄框保持亮；卡收起时一起退
      var dk = E(P(t, AT.zc + 0.4, 0.6)) * (1 - E(P(t, AT.zOut, AT.shrink - AT.zOut)));
      T.$('dim').style.opacity = 0.35 * dk;

      // 第 1 句：五路落下；第 2 句：同时亮起、不带开发对话框、隔板
      for (var i = 1; i <= 5; i++) {
        var a = T.$('a' + i);
        T.enter(a, P(t, AT.ag + (i - 1) * 0.12, 0.5), 14);
        cur(a, on(t, AT.lit, AT.litEnd), i === 5 ? 0.001 : 10);
        var b = T.$('b' + i);
        b.style.opacity = E(P(t, AT.box + (i - 1) * 0.1, 0.4));
      }
      T.all('.wall').forEach(function (w, j) { T.wipe(w, P(t, AT.wall + j * 0.12, 0.5), 'x'); });

      // 第 3 句：漏斗、括线、箭头
      T.$('fun').style.opacity = E(P(t, AT.fun, 0.4));
      T.$('fl').style.opacity = E(P(t, AT.fun + 0.2, 0.4));
      wire(T.$('br'), E(P(t, AT.br, 0.5)));
      wire(T.$('ar1'), E(P(t, AT.br + 0.4, 0.6)));
      T.$('funCur').setAttribute('opacity', on(t, AT.funCur, AT.funEnd));

      // 发现：起点 → 漏斗口；f5 第 4 句被筛出；f1–f4 第 5 句落进裁决格
      for (var k = 1; k <= 5; k++) {
        var f = T.$('f' + k), s = AT.fd + (k - 1) * AT.fdGap;
        f.style.opacity = E(P(t, s, 0.25));
        var xy = lerp(START[k - 1], MOUTH[k - 1], E(P(t, s, 0.55)));
        if (k === 5) {
          xy = lerp(xy, OUT, E(P(t, AT.rejOut, 0.7)));
          var g5 = E(P(t, AT.rejOut + 0.3, 0.4));
          f.style.background = T.mix(CREAM, GRAY, g5);
          f.querySelector('.x').style.opacity = g5;
        } else {
          var d = E(P(t, AT.drop[k - 1], 0.6));
          xy = lerp(xy, BIN[k - 1], d);
          if (k === 4) f.style.background = T.mix(CREAM, GRAY, E(P(t, AT.drop[3] + 0.4, 0.4)));
        }
        place(f, xy);
      }
      cur(T.$('f5'), on(t, AT.rejCur, AT.rejOut + 1.6), 5);
      T.enter(T.$('rej'), P(t, AT.rejOut + 0.6, 0.4), -10);

      // 第 5 句：裁决卡
      wire(T.$('ar2'), E(P(t, AT.vd, 0.4)));
      T.enter(T.$('vd'), P(t, AT.vd, 0.5), 16);
      cur(T.$('vd'), on(t, AT.vdCur, 999), 10);

      return seekVideo(SRC0 + Math.min(SRC1 - SRC0, Math.max(0, t - AT.play)));
    }
  });
</script>
</body>
</html>
