  function on(t, a, b) { return T.ease(T.p(t, a, 0.4)) * (1 - T.ease(T.p(t, b, 0.4))); }
  function show(id, t, a, dy) { T.enter(T.$(id), T.p(t, a, 0.45), dy === undefined ? 12 : dy); }
  function fade(id, t, a) { var e = T.ease(T.p(t, a, 0.4)), el = T.$(id); el.style.opacity = e; el.style.transform = 'translateY(' + ((1 - e) * 8) + 'px)'; }
  function draw(id, t, a) { var l = T.$(id), p = T.ease(T.p(t, a, 0.4)); l.style.opacity = p > 0 ? 1 : 0; l.setAttribute('stroke-dasharray', 1); l.setAttribute('stroke-dashoffset', 1 - p); }
  // 行内黄框：同 T.current，但间距收小，相邻两行不互相盖住
  function rowCur(el, g) {
    el.style.outline = '6px solid rgba(245,207,74,' + g + ')';
    el.style.outlineOffset = '6px';
    el.style.boxShadow = '0 0 40px rgba(245,207,74,' + (0.4 * g) + ')';

      draw('a3', t, CUE.closed);
      var f = T.$('file'), sl = T.ease(T.p(t, CUE.slide, CUE.slideLen));
      var p0 = T.p(t, CUE.file, 0.45), e0 = T.ease(p0);

      rowCur(T.$('f1'), on(t, CUE.f1, CUE.f2));
      rowCur(T.$('f2'), T.ease(T.p(t, CUE.f2, 0.4)));
