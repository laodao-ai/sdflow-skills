# ═════════════════════════════════════════════════════════════
# 【config 起始模版】—— openspec/workflow/ bundle 的一部分。
# 用法（新项目）：
#   1. 规则经全局 canonical（~/.sdflow/workflow）解析，仓内仅 tools/；下文 @openspec/workflow/... 引用在无本地
#      副本的仓中 = 全局 bundle 内同名文件（resolve-workflow.sh 输出根）。
#   2. 把本文件**另存为** openspec/config.yaml（OpenSpec 实际读取的是它，不是本模版）。
#   3. 通用部分照搬：本注释、context 的「通用」段、全部 rules。
#   4. 仅替换 context 的「本项目」段为该项目的 tech stack / 约定。
# 维护：本模版是通用部分的**移植母本**；各项目 openspec/config.yaml 为实例，
#       改 rule 先改本模版，再同步到 openspec/config.yaml 及其他项目。
# ─────────────────────────────────────────────────────────────
# 升级安全的叠加层：本文件的 context/rules 是对 OpenSpec 自带 schema 的【加法】。
# · openspec update 不会覆盖 openspec/config.yaml（init 检测到已存在即跳过）。
# · 不改包内模版、不改 proposal→specs→design→tasks 流程；只在生成时追加必填槽。
# · rules 是给 AI 的生成软约束（非 validate 硬校验）。要硬卡须改 schema（则不再升级安全）。
# ═════════════════════════════════════════════════════════════
schema: spec-driven

# 项目上下文（生成产物时展示给 AI）
context: |
  ## 通用｜spec 工作流规则集（随模版携带，勿删）
  spec 质量规则集见 openspec/workflow/（无本地副本时为 ~/.sdflow/workflow/，下同）：
  - trigger-catalog.md      触发词目录 TG-01~24（约束/领域/画图/模版必填槽 的公共触发源）
  - spec-checklists/        通用 base(BASE-01~28) + 领域 domains(backend·go / embedded·ml307c·esp32 / frontend)
  - design-diagrams.md      设计画图规则（哪些图、何时画、ASCII 优先）
  - ff-generation-constraints.md  生成时硬约束 D-1~D-6
  - generation-process.md   生成过程（explore/brainstorming/grill 三相位）
  起手对变更评估 trigger-catalog，命中的触发激活对应必填槽 / D约束 / 画图 / 领域清单。
  触发判定一律用具体行为描述，不用风险代号。

  ## 本项目｜tech stack / 约定（每个项目自填；新项目替换本段）
  <在此填写：Tech stack / API style / DB 访问 / Forbidden patterns / 详见 CLAUDE.md 等>

# 按 artifact 注入的自定义规则（升级安全：在仓库内，openspec update 不覆盖）
# 槽位分「无条件必填」与「〔TG-NN〕命中才必填」两类；TG 定义见 trigger-catalog.md。
rules:
  proposal:
    - 无条件必含小节，统一用英文标题（与 OpenSpec 模板一致）：`## Why`（问题/动机）、`## Success Metrics`、`## Non-Goals`（不在本次范围）、`## Compliance`（合规声明，不适用写 N/A）
    - 按 @openspec/workflow/trigger-catalog.md 评估并加节：TG-19→需求优先级(P0/P1/P2)、TG-20→利益相关方与外部依赖、TG-21→开放问题(负责人/截止)、TG-22→假设(失效影响)、TG-24→外部服务成本估算
    - 命中 TG-01/02/03（技术栈）则在 Impact 标注，供下游按 @openspec/workflow/spec-checklists/ 选用领域清单
  specs:
    - 每个 Requirement 必挂 #### Scenario(WHEN/THEN)，Requirement 有稳定 ID（schema 已要求，强调不得遗漏）
    - 验收标准可观察、可测试，不得只写"测试通过"
  design:
    - 无条件必含小节，英文标题：`## Compliance`（规则/边界合规声明，遵守或显式豁免，禁沉默例外）
    - 按 trigger-catalog 命中加节：TG-04→v_old/v_new 对照表、TG-05→数据模型与生命周期、TG-07→请求/响应 JSON 示例、TG-08→失败模式表+可观测性、TG-15→可观测性、TG-16→NFR 数字化、TG-17→安全与数据保护、TG-23→决策记录 ADR、TG-13/14→组件清单
    - 按 @openspec/workflow/design-diagrams.md 画图：TG-09→状态机图、TG-10→序列图、TG-11→数据流图、TG-12→决策图、TG-13→C4 Context+Container；非平凡变更至少一张组件/依赖图
    - 代码事实(函数名/字段/API 路径)先核验再写入，禁从记忆直接写
  tasks:
    - 每个任务标注对应 Requirement ID（与 specs 双向追溯，无幽灵任务）
    - 命中 TG-18(有测试计划) 则产出测试覆盖图（code path → 测试类型）
    - 单任务控制在可独立验证的小粒度
    - Group related tasks under numbered sections

# model-tiers（可选覆盖段）——真相源 = 规则根 model-tiers.md（resolver 解析）。
# 此段仅 per-repo 覆盖"档位→模型"映射；缺省请勿填（留空即用 canonical 缺省）。
# model-tiers:
#   strong: <model-id>
#   mid: <model-id>
#   light: <model-id>
