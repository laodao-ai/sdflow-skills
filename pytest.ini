# 仓根 pytest 配置 —— **存在的唯一理由是把 rootdir 钉死在仓根**。
#
# 为什么必须有这个文件：pytest 的 conftest 收集止于 confcutdir，而 confcutdir 默认 = rootdir。
# 没有任何 ini 文件时 rootdir 是**推断**出来的——从仓根 cwd 跑会推成仓根（碰巧对），
# 但从仓外的干净目录跑 `pytest /abs/path/<skill>/tests/`，rootdir 会塌缩成 `<skill>/tests`
# 本身，仓根的 conftest.py 于是**根本不会被收集**，cwd 泄漏断言静默失效（实测确认）。
#
# 一个含 [pytest] 段的 ini 文件即可让 rootdir 恒等于本文件所在目录 ⇒ 仓根 conftest.py
# 在任何调用姿势下都被收集。除此之外本文件 MUST NOT 承载任何配置——各 skill 的测试
# 保持自包含，不在这里集中声明 testpaths / markers / addopts。

[pytest]
