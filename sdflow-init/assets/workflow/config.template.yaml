# ═════════════════════════════════════════════════════════════
# 【config 起始模版】—— openspec/workflow/ bundle 的一部分。
# 用法（新项目）：
#   1. 规则经全局 canonical（~/.sdflow/workflow）解析，仓内仅 tools/；下文 @openspec/workflow/... 引用在无本地
#      副本的仓中 = 全局 bundle 内同名文件（resolve-workflow.sh 输出根）。
#   2. 把本文件**另存为** openspec/config.yaml（OpenSpec 实际读取的是它，不是本模版）。
#   3. 通用部分照搬：本注释、context 的「通用」段、全部 rules。
#   4. 仅替换 context 的「本项目」段为该项目的 tech stack / 约定。
# 维护：本模版是通用部分的**移植母本**；各项目 openspec/config.yaml 为实例，
#       改 rule 先改本模版，再同步到 openspec/config.yaml 及其他项目。
# ─────────────────────────────────────────────────────────────
# 升级安全的叠加层：本文件的 context/rules 是对 OpenSpec 自带 schema 的【加法】。
# · openspec update 不会覆盖 openspec/config.yaml（init 检测到已存在即跳过）。
# · 不改包内模版、不改 proposal→specs→design→tasks 流程；只在生成时追加必填槽。
# · rules 是给 AI 的生成软约束（非 validate 硬校验）。要硬卡须改 schema（则不再升级安全）。
# ═════════════════════════════════════════════════════════════
schema: sdflow-spec-driven

# 项目上下文（生成产物时展示给 AI）
context: |
  ## 通用｜spec 工作流规则集（随模版携带，勿删）
  spec 质量规则集见 openspec/workflow/（无本地副本时为 ~/.sdflow/workflow/，下同）：
  - trigger-catalog.md      触发词目录 TG-NN（约束/领域/画图/模版必填槽 的公共触发源）
  - spec-checklists/        通用 base(BASE-NN) + 领域 domains(backend·go / embedded·ml307c·esp32 / frontend(+frontend-react))
  - design-diagrams.md      设计画图规则（哪些图、何时画、ASCII 优先）
  - ff-generation-constraints.md  生成时硬约束 D-1~D-6
  - generation-process.md   生成过程：explore 发散 + /sdflow-spec（澄清→拷问→生成三相位）
  起手对变更评估 trigger-catalog，命中的触发激活对应必填槽 / D约束 / 画图 / 领域清单。
  触发判定一律用具体行为描述，不用风险代号。

  ## 本项目｜tech stack / 约定（每个项目自填；新项目替换本段）
  <在此填写：Tech stack / API style / DB 访问 / Forbidden patterns / 详见 CLAUDE.md 等>

# 按 artifact 注入的自定义规则（升级安全：在仓库内，openspec update 不覆盖）
# 槽位分「无条件必填」与「〔TG-NN〕命中才必填」两类；TG 定义见 trigger-catalog.md。
rules:
  proposal:
    - 无条件必含小节，统一用英文标题（与 OpenSpec 模板一致）：`## Why`（问题/动机）、`## Success Metrics`、`## Non-Goals`（不在本次范围）、`## Compliance`（合规声明，不适用写 N/A）
    - 按 @openspec/workflow/trigger-catalog.md 评估并加节：TG-19→需求优先级(P0/P1/P2)、TG-20→利益相关方与外部依赖、TG-21→开放问题(负责人/截止)、TG-22→假设(失效影响)、TG-24→外部服务成本估算
    - 命中 TG-01/02/03（技术栈）则在 Impact 标注，供下游按 @openspec/workflow/spec-checklists/ 选用领域清单
  specs:
    - 每个 Requirement 必挂 #### Scenario(WHEN/THEN)，Requirement 有稳定 ID（schema 已要求，强调不得遗漏）
    - 验收标准可观察、可测试，不得只写"测试通过"
    - 新能力 delta spec MUST 以 `## Purpose` 开头（≥50 字符）；1.7.0 archive 抬升此段进主 spec，缺则写 TBD 占位符
  design:
    - 无条件必含小节，英文标题：`## Compliance`（规则/边界合规声明，遵守或显式豁免，禁沉默例外）
    - 按 trigger-catalog 命中加节：TG-04→v_old/v_new 对照表、TG-05→数据模型与生命周期、TG-07→请求/响应 JSON 示例、TG-08→失败模式表+可观测性、TG-15→可观测性、TG-16→NFR 数字化、TG-17→安全与数据保护、TG-23→决策记录 ADR、TG-13/14→组件清单
    - 按 @openspec/workflow/design-diagrams.md 画图：TG-09→状态机图、TG-10→序列图、TG-11→数据流图、TG-12→决策图、TG-13→C4 Context+Container；非平凡变更至少一张组件/依赖图
    - 代码事实(函数名/字段/API 路径)先核验再写入，禁从记忆直接写
  tasks:
    - 每个任务标注对应 Requirement ID（与 specs 双向追溯，无幽灵任务）
    - 命中 TG-18(有测试计划) 则产出测试覆盖图（code path → 测试类型）
    - 单任务控制在可独立验证的小粒度
    - Group related tasks under numbered sections

# model-tiers（可选覆盖段）——真相源 = 规则根 model-tiers.md（resolve-models.sh 按宿主机队解析）。
# 此段仅 per-repo 覆盖"档位→模型"映射，MUST 按机队分键（add-codex-host-support · ADR-8）：
# model-tiers.{claude,codex}.{strong,mid,light}；resolve-models.sh 按当前宿主所属机队读对应段，
# 无该段回落机队缺省。扁平旧格式（无机队分键，见下）兼容读作 Claude 机队覆盖，仅在 Claude 宿主下
# 生效，Codex 宿主下不生效（MUST NOT 把 Claude 模型名塞给 Codex 机队）。缺省请勿填。
# model-tiers:
#   claude:
#     strong: <claude-model-id>
#     mid: <claude-model-id>
#     light: <claude-model-id>
#   codex:
#     strong: <codex-model-id>
#     mid: <codex-model-id>
#     light: <codex-model-id>
#
# 扁平旧格式（历史遗留，兼容读作 Claude 机队覆盖，不推荐新写）：
# model-tiers:
#   strong: <claude-model-id>
#   mid: <claude-model-id>
#   light: <claude-model-id>

# effort-tiers（可选覆盖段）——真相源 = 规则根 model-tiers.md 的 effort-tier-defaults 机读块
# （strong→high / mid→medium / light→low）。此段仅 per-repo 覆盖"档位→effort"映射，仅 claude
# 机队有对应物（codex 无 effort 原语，不写键即 n/a，MUST NOT 引入空值语义）。值域固定
# {low,medium,high,xhigh,max}，非法值忽略覆盖回落缺省并告警（与 model-tiers 段同语义）。缺省请勿填。
# effort-tiers:
#   claude:
#     strong: high
#     mid: medium
#     light: low

# test-suites（可选段）——sdflow-implement「聚合套件发现契约」的命令来源，优先于该票
# implementer 运行时判定。缺省请勿填（未配置层由该票 implementer 依仓内既有约定判定）。
# 具体命令因项目而异，由 sdflow-devenv 运行时调研测试基础设施后推荐写入（已有配置时保留不覆盖），
# 本模版只示范两种合法形状；旧形状（字符串）是新形状（映射）的子集，未分档的消费仓行为不变。
#
# 形状一：字符串——quick 与 full 两档同命令（今日形状，继续有效）：
# test-suites:
#   unit: "go test ./..."
#   integration: "make integration"
#   e2e: "make e2e"
#
# 形状二：映射——quick/full 分档（成本分档）。缺 `quick` 视为该层无 quick 档
# （unit 层例外：中间 fix 轮缺 quick 取 full，MUST NOT 因此跳过 unit 层）；
# 缺 `full` 视为未分档（quick=full 同命令）：
# test-suites:
#   unit:
#     quick: "go test -short ./..."
#     full: "go test ./..."
#   integration:
#     full: "make integration"   # 未分档，quick 亦取此命令
#   e2e:
#     full: "make e2e"

# operations（可选段）——按操作类型（如 archive）下沉给执行子代理的硬约束指引。
# guidance 形状为字符串数组（非字符串），否则 CLI 拒绝并打警告。
operations:
  archive:
    guidance:
      - "归档 MUST 走 openspec archive CLI（它同步 delta→openspec/specs/ + 更新 INDEX + 校验），禁手动 mv（漏 spec 同步）"
      - "archive 前 MUST 先 reconcile tasks.md 复选框（否则 CLI 报 N/M incomplete 警告 + verify 误判）"

# 评审价值度量（lens-metric）开关：低频消费仓默认关（避免零收益期背记账+硬阻塞）；
# 高频仓可改 true 开启。契约见 lens-metric-contract.md。
metrics:
  enabled: false
